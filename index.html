                    text = "請詳細描述畫面中的內容。"; // 如果只有截圖沒說話，自動加上預設文字
                }
            }

            if (!text && !fileData) return;

            inputEl.value = ''; autoResizeInput(inputEl);
            
            // 將檔案暫存後清空 UI
            if (appState.chatFile) clearChatFile();

            addMessage(text || `[夾帶檔案/畫面: ${fileData.name}]`, 'user', null, [], fileData);
            
            appState.isThinking = true; updateSendButtonState(true); renderThinkingState(true);
            try {
                // 如果開啟搜尋模式，先呼叫外部 API 獲取資料
                let searchContext = "";
                let sources = [];
                if (appState.isSearchEnabled) {
                    addMessage("🌐 正在連網搜尋最新資料...", 'system');
                    try {
                        let queryUrl = appState.docMonitorUrl; // 優先使用自架 Apps Script 爬蟲代理
                        
                        if (queryUrl && queryUrl.includes("script.google.com")) {
                            // 呼叫 Google Apps Script Agent
                            const res = await fetch(queryUrl, { 
                                method: 'POST', 
                                headers: { 'Content-Type': 'text/plain' },
                                body: JSON.stringify({ type: 'search', query: text }) 
                            });
                            const result = await res.json();
                            if (result.success) {
                                searchContext = "【即時網路搜尋結果】\n" + result.data + "\n\n請根據以上搜尋結果回答使用者問題。";
                                if (result.sources) sources = result.sources;
                            }
                        } else if (appState.keys.serpapi) {
                            // 使用 SerpApi (需要透過代理或允許 CORS 的 Endpoint，此處為模擬邏輯，實際前端直連 SerpApi 會遇 CORS，除非他們開放)
                            // 這裡直接模擬將搜尋意圖告知 AI
                            searchContext = "【使用者要求連網搜尋】請盡可能提供最新資訊。";
                        } else {
                            // 預設提示
                             searchContext = "【使用者要求連網搜尋】但系統尚未設定代理或 API Key，請以您的既有知識庫盡力提供最新、最詳細的解答。";
                        }
                    } catch(e) {
                        console.error("Search Error:", e);
                    }
                }

                // 組合最終 Prompt
                let finalPrompt = text;
                if (searchContext) finalPrompt = `${searchContext}\n\n使用者問題：${text}`;

                const response = await fetchAIResponse(finalPrompt, appState.currentModel, { file: fileData });
                let finalAiText = typeof response === 'string' ? response : response.text;
                let parsedActionData = response.actionData || null;

                // 分析 AI 回覆中是否包含待辦事項意圖
                if (!appState.isLiveMode && appState.translateMode === 'off') {
                    const todoMatch = finalAiText.match(/\[任務：(.*?)\]/);
                    if (todoMatch) {
                        const taskText = todoMatch[1];
                        const n = { id: Date.now(), text: taskText, done: false, time: 'AI 自動建立', alertEnabled: true }; 
                        appState.todos.push(n); saveToDB('todos', n); renderTodos();
                        finalAiText = finalAiText.replace(/\[任務：.*?\]/g, '').trim();
                        showToast("✅ 已自動為您建立一筆新任務");
                    }
                }

                const newAiMsg = addMessage(finalAiText, 'ai', appState.currentModel, sources, null, parsedActionData);
                speakText(finalAiText, false, newAiMsg.id);

            } catch (err) {
                console.error(err);
                addMessage("⚠️ 系統錯誤：" + err.message + "\n(請確認 API Key 是否設定正確，或檢查網路連線)", 'system');
            } finally {
                appState.isThinking = false; updateSendButtonState(false); renderThinkingState(false);
            }
        }

        // --- 核心 AI 串接邏輯 (支援 Context) ---
        async function fetchAIResponse(prompt, model, options = {}) {
            let sysInstruction = `你是一個名為 NOVA 的頂級全能 AI 助理。你的語氣要專業、親切且富有同理心。除非使用者特別要求外語，請一律使用『繁體中文(台灣)』進行回覆。`;
            
            // 處理回覆長度設定
            if (appState.replyLength === 'short') sysInstruction += " 請用極其簡短、精簡的句子回覆（約50字以內），不廢話。";
            else if (appState.replyLength === 'unlimited') sysInstruction += " 請提供極度詳細、豐富、沒有字數限制的完整解答。";
            else sysInstruction += " 請給予適中長度、排版易讀的回覆。";

            sysInstruction += `\n如果使用者要求提醒、設定鬧鐘或安排行程，請在回覆中包含格式：[任務：事項內容] 以便系統自動建立任務。`;
            sysInstruction += `\n如果使用者的意圖是想要開啟某個手機 App (例如 Line、地圖、Youtube、電話等)，請在回覆的最後一行加上：JSON_ACTION: {"intentFound": true, "appName": "應用名稱", "deepLinkUrl": "對應的Scheme或URL", "actionDescription": "簡短描述"}`;

            // 準備歷史訊息 (Context)
            let history = [];
            if (appState.enableContext) {
                // 取最近的 10 筆有效對話
                const recentMsgs = appState.messages.filter(m => m.sender === 'user' || m.sender === 'ai').slice(-10);
                for (const msg of recentMsgs) {
                     history.push({
                         role: msg.sender === 'user' ? 'user' : 'model',
                         parts: [{ text: msg.text || "夾帶了檔案" }]
                     });
                }
            }

            try {
                if (model === 'gemini') {
                    if (!appState.keys.gemini) throw new Error("尚未設定 Gemini API Key");
                    let activeModel = appState.geminiModel === 'gemini-multi' ? 'gemini-2.5-flash' : appState.geminiModel;
                    
                    // 根據是否有檔案自動升級或降級模型
                    if (options.file && options.file.category === 'media' && !activeModel.includes('flash')) {
                         activeModel = 'gemini-2.5-flash'; // 確保能處理影片/音訊
                    }

                    // 影像生成判定
                    if (activeModel.includes('imagen-4.0') || activeModel.includes('grok-imagine')) {
                        return await generateImage(prompt, activeModel);
                    }

                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${appState.keys.gemini}`;
                    let parts = [{ text: prompt }];

                    if (options.file) {
                        const base64Data = options.file.data.split(',')[1];
                        parts.push({
                            inlineData: {
                                mimeType: options.file.mime,
                                data: base64Data
                            }
                        });
                    }

                    let contents = [];
                    if (history.length > 0) {
                        contents = [...history];
                        contents.push({ role: 'user', parts: parts });
                    } else {
                        contents = [{ role: 'user', parts: parts }];
                    }

                    const payload = {
                        systemInstruction: { parts: [{ text: sysInstruction }] },
                        contents: contents,
                        generationConfig: { temperature: 0.7 }
                    };

                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const data = await res.json();
                    
                    if (!res.ok) {
                        if (data.error && data.error.message) throw new Error(data.error.message);
                        throw new Error("HTTP " + res.status);
                    }

                    let textResult = data.candidates?.[0]?.content?.parts?.[0]?.text || "NOVA 思考中，但未返回文字。";
                    
                    return parseActionData(textResult);

                } else if (model === 'gpt') {
                     if (!appState.keys.openai) throw new Error("尚未設定 OpenAI API Key");
                     const url = "https://api.openai.com/v1/chat/completions";
                     let messages = [{ role: 'system', content: sysInstruction }];
                     
                     if (appState.enableContext) {
                         const mappedHistory = history.map(h => ({ role: h.role === 'model' ? 'assistant' : 'user', content: h.parts[0].text }));
                         messages = messages.concat(mappedHistory);
                     }

                     let userContent = prompt;
                     if (options.file && options.file.category === 'image') {
                          userContent = [
                              { type: "text", text: prompt },
                              { type: "image_url", image_url: { url: options.file.data } }
                          ];
                     }

                     messages.push({ role: 'user', content: userContent });

                     const res = await fetch(url, {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${appState.keys.openai}` },
                         body: JSON.stringify({ model: 'gpt-4o-mini', messages: messages, temperature: 0.7 })
                     });
                     const data = await res.json();
                     if (!res.ok) throw new Error(data.error?.message || "OpenAI API 錯誤");
                     
                     return parseActionData(data.choices[0].message.content);

                } else if (model === 'groq') {
                     if (!appState.keys.groq) throw new Error("尚未設定 Groq API Key");
                     const url = "https://api.groq.com/openai/v1/chat/completions";
                     let messages = [{ role: 'system', content: sysInstruction }];
                     
                     if (appState.enableContext) {
                         const mappedHistory = history.map(h => ({ role: h.role === 'model' ? 'assistant' : 'user', content: h.parts[0].text }));
                         messages = messages.concat(mappedHistory);
                     }
                     
                     messages.push({ role: 'user', content: prompt + (options.file ? "\n[夾帶了檔案，但Groq純文字模型可能無法讀取]" : "") });

                     const res = await fetch(url, {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${appState.keys.groq}` },
                         body: JSON.stringify({ model: 'llama-3.3-70b-versatile', messages: messages, temperature: 0.7 })
                     });
                     const data = await res.json();
                     if (!res.ok) throw new Error(data.error?.message || "Groq API 錯誤");
                     return parseActionData(data.choices[0].message.content);
                } else if (model === 'cohere') {
                     if (!appState.keys.cohere) throw new Error("尚未設定 Cohere API Key");
                     const url = "https://api.cohere.ai/v1/chat";
                     
                     let chatHistory = [];
                     if (appState.enableContext) {
                         chatHistory = history.map(h => ({ role: h.role === 'model' ? 'CHATBOT' : 'USER', message: h.parts[0].text }));
                     }

                     const res = await fetch(url, {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${appState.keys.cohere}` },
                         body: JSON.stringify({ model: 'command-r-plus', message: prompt + (options.file ? "\n[夾帶了檔案]" : ""), preamble: sysInstruction, chat_history: chatHistory })
                     });
                     const data = await res.json();
                     if (!res.ok) throw new Error(data.message || "Cohere API 錯誤");
                     return parseActionData(data.text);
                } else if (model === 'grok') {
                    if (!appState.keys.grok) throw new Error("尚未設定 Grok API Key");
                    let activeModel = appState.grokModel === 'grok-multi' ? 'grok-beta' : appState.grokModel;
                    
                    if (activeModel.includes('imagine')) {
                        return await generateImage(prompt, activeModel);
                    }

                    const url = "https://api.x.ai/v1/chat/completions";
                    let messages = [{ role: 'system', content: sysInstruction }];
                    if (appState.enableContext) {
                         const mappedHistory = history.map(h => ({ role: h.role === 'model' ? 'assistant' : 'user', content: h.parts[0].text }));
                         messages = messages.concat(mappedHistory);
                    }
                    messages.push({ role: 'user', content: prompt });

                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${appState.keys.grok}` },
                        body: JSON.stringify({ model: activeModel, messages: messages, temperature: 0.7 })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || "Grok API 錯誤");
                    return parseActionData(data.choices[0].message.content);
                }
            } catch (error) {
                console.error("API Call Error:", error);
                throw error;
            }
        }

        async function generateImage(prompt, modelName) {
            let finalPrompt = "請根據以下描述生成一張高質感的圖片：" + prompt;
            if (modelName.includes('imagen')) {
                 if (!appState.keys.gemini) throw new Error("生成圖片需要 Gemini API Key");
                 const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:predict?key=${appState.keys.gemini}`;
                 const payload = { instances: { prompt: prompt }, parameters: { sampleCount: 1 } };
                 const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                 const data = await res.json();
                 if(!res.ok) throw new Error(data.error?.message || "Imagen API 錯誤");
                 const base64 = data.predictions[0].bytesBase64Encoded;
                 appState.chatFile = { category: 'image', data: `data:image/jpeg;base64,${base64}`, mime: 'image/jpeg', name: 'Generated_Image.jpg' };
                 return "這是我為您生成的圖片，希望您喜歡！";
            }
            throw new Error("尚未支援此圖片生成模型：" + modelName);
        }

        function parseActionData(text) {
            let actionData = null;
            let cleanText = text;
            const match = text.match(/JSON_ACTION:\s*(\{.*?\})/);
            if (match) {
                try {
                    actionData = JSON.parse(match[1]);
                    cleanText = text.replace(/JSON_ACTION:\s*(\{.*?\})/, '').trim();
                } catch(e) { console.error("Parse Action JSON failed", e); }
            }
            return { text: cleanText, actionData: actionData };
        }

        // --- 語音辨識邏輯 (Web Speech API) ---
        function setupSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                console.warn("瀏覽器不支援 SpeechRecognition");
                return;
            }
            const SpeechRecClass = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            // 主對話辨識器
            recognition = new SpeechRecClass();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = appState.currentListenLang;

            recognition.onstart = () => { 
                appState.isListening = true; 
                appState.currentListenLang = 'cmn-Hant-TW'; // 預設使用繁體中文
                recognition.lang = appState.currentListenLang;
                document.getElementById('user-input').placeholder = "聆聽中...";
            };

            recognition.onresult = (event) => {
                let interimTranscript = ''; let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }
                
                if (appState.recordingContext !== 'default') {
                    appState.currentAudioTranscript += finalTranscript;
                }

                if (appState.isContinuous || appState.isLiveMode || appState.translateMode === 'A') {
                    document.getElementById('user-input').value = chatInitialInput + finalTranscript + interimTranscript;
                    autoResizeInput(document.getElementById('user-input'));
                    if (finalTranscript) {
                        chatInitialInput = "";
                        if (voiceTimer) clearTimeout(voiceTimer);
                        voiceTimer = setTimeout(() => {
                            if (!appState.isThinking && !appState.isTTSPlaying) handleSendMessage();
                        }, appState.voiceTimeout * 1000);
                    }
                }
            };

            recognition.onerror = (e) => { console.log('Speech recognition error', e.error); };
            recognition.onend = () => {
                appState.isListening = false;
                document.getElementById('user-input').placeholder = "輸入訊息...";
                
                if ((appState.isContinuous || appState.isLiveMode || appState.translateMode === 'A') && !appState.isThinking && !appState.isTTSPlaying && appState.recordingContext === 'default') {
                    setTimeout(() => { try { recognition.start(); } catch(e){} }, 300);
                }
            };
        }

        // --- 鬧鐘與提醒檢查邏輯 ---
        function checkAlarms() {
            const now = Date.now();
            appState.todos.forEach(t => {
                if (t.alertTime && !t.alerted && t.alertEnabled !== false) {
                    if (now >= t.alertTime) {
                        t.alerted = true;
                        saveToDB('todos', t);
                        triggerAlarm(t.text);
                        renderTodos();
                    }
                }
            });
        }

        function triggerAlarm(text) {
            document.getElementById('alarm-text').innerText = text;
            document.getElementById('alarm-modal').classList.remove('hidden');
            
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!alarmAudioCtx) alarmAudioCtx = new AudioContextClass();
                const osc = alarmAudioCtx.createOscillator();
                const gain = alarmAudioCtx.createGain();
                osc.connect(gain);
                gain.connect(alarmAudioCtx.destination);
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, alarmAudioCtx.currentTime); // A5
                osc.frequency.setValueAtTime(0, alarmAudioCtx.currentTime + 0.2);
                osc.frequency.setValueAtTime(880, alarmAudioCtx.currentTime + 0.4);
                
                gain.gain.setValueAtTime(0.1, alarmAudioCtx.currentTime);
                
                osc.start();
                osc.stop(alarmAudioCtx.currentTime + 0.6);
            } catch(e) {}

            speakText(`時間到了！提醒您：${text}`, true);
        }

        window.stopAlarm = function() {
            document.getElementById('alarm-modal').classList.add('hidden');
            window.speechSynthesis.cancel();
        }

        // --- 初始化與生命週期 ---
        window.onload = async () => {
            const dbInstance = await initDB();
            if (dbInstance) {
                appState.messages = await loadStoreFromDB('messages');
                appState.notes = await loadStoreFromDB('notes');
                appState.todos = await loadStoreFromDB('todos');
                appState.audioRecords = await loadStoreFromDB('audioRecords');
            }
            
            setupSpeechRecognition();
            
            renderAll();
            updateModelUI();
            tryGetLocation(true); // 預設靜默取得位置
            
            alarmInterval = setInterval(checkAlarms, 10000); // 每 10 秒檢查一次鬧鐘
            
            // 監聽鍵盤快捷鍵 (防呆處理)
            document.addEventListener('keydown', (e) => {
                if(e.ctrlKey && e.key === 'q') toggleContinuous();
                if(e.ctrlKey && e.key === 'm') document.getElementById('user-input').focus();
            });
        };

    </script>
