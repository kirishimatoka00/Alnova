<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA 78</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{slate:{925:'#0f172a'}},animation:{'pulse-fast':'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite','spin-slow':'spin 2s linear infinite'}}}}
    </script>
    <style>
        ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-track{background:#1e293b;} ::-webkit-scrollbar-thumb{background:#475569;border-radius:3px;} .no-scrollbar::-webkit-scrollbar{display:none;} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
        .fade-in{animation:fadeIn 0.3s ease-in-out;}
        .dot-flashing{position:relative;width:6px;height:6px;border-radius:5px;background-color:#9880ff;color:#9880ff;animation:dot-flashing 1s infinite linear alternate;animation-delay:0.5s;}
        .dot-flashing::before,.dot-flashing::after{content:"";display:inline-block;position:absolute;top:0;width:6px;height:6px;border-radius:5px;background-color:#9880ff;color:#9880ff;animation:dot-flashing 1s infinite alternate;}
        .dot-flashing::before{left:-10px;animation-delay:0s;} .dot-flashing::after{left:10px;animation-delay:1s;}
        @keyframes dot-flashing{0%{background-color:#9880ff;} 50%,100%{background-color:rgba(152,128,255,0.2);}}
        .msg-content a,#doc-content-area a{color:#60a5fa;text-decoration:underline;word-break:break-all;cursor:pointer;}
        .msg-content p,#doc-content-area div{margin-bottom:0.5em;line-height:1.6;}
        .slide-in{animation:slideIn 0.3s ease-out;} .msg-group:hover .msg-actions{opacity:1;} .msg-actions{opacity:0;transition:opacity 0.2s;}
        @keyframes recordPulse{0%{transform:scale(1);opacity:1;} 50%{transform:scale(1.1);opacity:0.8;} 100%{transform:scale(1);opacity:1;}} .recording-dot{animation:recordPulse 1.5s infinite;}
        #toast{visibility:hidden;min-width:250px;background-color:#334155;color:#fff;text-align:center;border-radius:8px;padding:12px;position:fixed;z-index:100;left:50%;transform:translateX(-50%);bottom:30px;font-size:14px;opacity:0;transition:opacity 0.3s,bottom 0.3s;box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);}
        #toast.show{visibility:visible;opacity:1;bottom:120px;}
        audio{outline:none;border-radius:8px;} audio::-webkit-media-controls-panel{background-color:#1e293b;color:#fff;} audio::-webkit-media-controls-current-time-display,audio::-webkit-media-controls-time-remaining-display{color:#fff;}
        .note-html-content, .note-html-content * { color: inherit !important; background-color: transparent !important; font-family: inherit !important; }
        .note-html-content img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 0.5rem 0; background-color: #f8fafc; display: inline-block; }
        .note-html-content a { color: #60a5fa !important; text-decoration: underline !important; }
        .note-html-content ul { list-style-type: disc; margin-left: 1.5rem; }
        .note-html-content ol { list-style-type: decimal; margin-left: 1.5rem; }
        [contenteditable]:empty:before { content: attr(placeholder); color: #64748b; pointer-events: none; display: block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden selection:bg-blue-500/30">
    <div class="flex h-[100dvh] w-full relative">
        <!-- 側邊欄 -->
        <aside class="hidden md:flex flex-col w-64 bg-slate-900 border-r border-slate-800 p-6 flex-shrink-0 z-10">
            <div class="flex items-center space-x-3 mb-10 px-2">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20"><i class="ph-bold ph-infinity text-white text-xl"></i></div>
                <div><h1 class="text-xl font-bold text-white tracking-wide">NOVA 78</h1><p class="text-[10px] text-slate-400 uppercase tracking-wider">Ultimate Edition</p></div>
            </div>
            <nav class="flex-1 space-y-2">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item flex items-center space-x-3 w-full p-4 rounded-xl bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-lg transition-all"><i class="ph ph-chats-circle text-xl"></i><span class="font-medium">助理對話</span></button>
                <button onclick="switchTab('schedule')" id="nav-schedule" class="nav-item flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all"><i class="ph ph-calendar-check text-xl"></i><span class="font-medium">行程管理</span></button>
                <button onclick="switchTab('notes')" id="nav-notes" class="nav-item flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all"><i class="ph ph-notebook text-xl"></i><span class="font-medium">筆記/文件</span></button>
                <button onclick="switchTab('audio')" id="nav-audio" class="nav-item flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all"><i class="ph ph-waveform text-xl"></i><span class="font-medium">錄音紀錄</span></button>
            </nav>
            <div class="mt-auto space-y-3">
                <button onclick="openSettings()" class="flex items-center space-x-2 text-xs text-slate-500 hover:text-slate-300 w-full px-2"><i class="ph ph-gear"></i><span>設定 & 備份</span></button>
                <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50">
                    <div class="flex items-center space-x-2"><i id="status-icon" class="ph-fill ph-globe text-blue-400 text-lg"></i><span id="status-name" class="font-bold text-sm">Gemini</span></div>
                    <p id="model-version-display" class="text-[10px] text-slate-500 mt-1">Ready</p>
                </div>
            </div>
        </aside>

        <!-- 主內容區 -->
        <main class="flex-1 flex flex-col relative bg-slate-950 overflow-hidden min-h-0">
            <!-- 行動版頂部 -->
            <div class="md:hidden flex items-center justify-between p-3 bg-slate-900 border-b border-slate-800 z-30 shrink-0">
                <div class="flex items-center space-x-2 shrink-0"><i class="ph-bold ph-infinity text-blue-500 text-xl"></i><span class="font-bold text-white">Nova 78</span></div>
                <div class="flex items-center space-x-3 ml-auto pl-2">
                    <div class="flex items-center space-x-1 bg-slate-800/50 px-2 py-1 rounded-lg border border-slate-700/50 cursor-pointer active:scale-95 transition-transform" onclick="cycleManualLocation()"><i id="mobile-weather-icon" class="ph-fill ph-navigation-arrow text-blue-400"></i><span id="mobile-weather-temp" class="text-xs font-bold text-white whitespace-nowrap">更新</span></div>
                    <button onclick="openSettings()"><i class="ph ph-gear text-slate-400 text-xl"></i></button>
                    <button onclick="toggleMobileMenu()"><i class="ph ph-list text-white text-2xl"></i></button>
                </div>
            </div>

            <!-- 行動版選單 -->
            <div id="mobile-menu" class="hidden md:hidden fixed inset-0 z-40 bg-slate-950/95 pt-20 px-6 backdrop-blur-md">
                <nav class="space-y-4">
                    <button onclick="switchTab('dashboard'); toggleMobileMenu()" class="flex items-center space-x-3 w-full p-4 rounded-xl bg-slate-800 text-white"><i class="ph ph-chats-circle text-xl"></i><span>助理對話</span></button>
                    <button onclick="switchTab('schedule'); toggleMobileMenu()" class="flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800"><i class="ph ph-calendar-check text-xl"></i><span>行程管理</span></button>
                    <button onclick="switchTab('notes'); toggleMobileMenu()" class="flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800"><i class="ph ph-notebook text-xl"></i><span>筆記/文件</span></button>
                    <button onclick="switchTab('audio'); toggleMobileMenu()" class="flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800"><i class="ph ph-waveform text-xl"></i><span>錄音紀錄</span></button>
                </nav>
            </div>

            <!-- 設定視窗 -->
            <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl flex flex-col max-h-[90vh]">
                    <div class="flex justify-between items-center mb-6 shrink-0"><h3 class="text-xl font-bold text-white">設定</h3><button onclick="closeSettings()"><i class="ph ph-x text-2xl text-slate-400"></i></button></div>
                    <div class="space-y-4 overflow-y-auto flex-1 pr-2 scrollbar-thin">
                        <div class="bg-gradient-to-r from-blue-900/30 to-indigo-900/30 p-4 rounded-xl border border-blue-500/50 shadow-inner space-y-4">
                            <div><label class="block text-xs text-blue-300 mb-2 font-bold flex items-center gap-2"><i class="ph-fill ph-robot"></i> 系統代理 Google Doc (搜尋/爬蟲)</label><input type="text" id="key-doc-url" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs focus:border-blue-500 outline-none mb-2" placeholder="Apps Script URL"></div>
                            <div class="grid grid-cols-1 gap-2">
                                <div><label class="block text-xs text-emerald-300 mb-1 font-bold"><i class="ph-fill ph-notebook"></i> 隨手記事本 A URL</label><input type="text" id="key-note-doc-url" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-emerald-500 outline-none"></div>
                                <div><label class="block text-xs text-teal-300 mb-1 font-bold"><i class="ph-fill ph-notebook"></i> 隨手記事本 B URL</label><input type="text" id="key-note-doc-url-2" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-teal-500 outline-none"></div>
                            </div>
                            <div class="border-t border-white/10 pt-2"><label class="block text-xs text-red-300 mb-1 font-bold"><i class="ph-fill ph-upload"></i> Google Drive 上傳 URL (備份用)</label><input type="text" id="key-drive-url" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-red-500 outline-none"></div>
                            <div class="flex items-center justify-between mt-2"><span id="doc-monitor-status" class="text-[10px] text-slate-500">未測試</span><button onclick="testDocConnection()" class="text-[10px] bg-blue-600 px-3 py-1 rounded text-white hover:bg-blue-500">測試連線</button></div>
                        </div>
                        <div class="space-y-3 pt-2 pb-4 border-b border-slate-800">
                            <div><label class="block text-xs text-blue-400 mb-1">Gemini API Key</label><input type="password" id="key-gemini" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-blue-500 outline-none"></div>
                            <div><label class="block text-xs text-green-400 mb-1">SerpApi Key</label><input type="password" id="key-serpapi" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-green-500 outline-none"></div>
                            <div><label class="block text-xs text-rose-400 mb-1">Groq API Key</label><input type="password" id="key-groq" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-rose-500 outline-none"></div>
                            <div><label class="block text-xs text-violet-400 mb-1">Cohere API Key</label><input type="password" id="key-cohere" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-violet-500 outline-none"></div>
                            <div><label class="block text-xs text-emerald-400 mb-1">OpenAI API Key</label><input type="password" id="key-openai" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-emerald-500 outline-none"></div>
                            <div><label class="block text-xs text-slate-300 mb-1">Grok API Key</label><input type="password" id="key-grok" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-slate-500 outline-none"></div>
                            
                            <div class="border-t border-slate-700 pt-3 mt-2">
                                <label class="block text-xs text-amber-400 mb-1 font-bold"><i class="ph-fill ph-timer"></i> 連續語音等待秒數 (秒)</label>
                                <input type="number" id="key-voice-timeout" min="1" max="60" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-amber-500 outline-none text-slate-300" placeholder="預設: 5">
                            </div>
                            <div class="flex items-center justify-between border-t border-slate-700 pt-3 mt-2">
                                <div><label class="block text-xs text-emerald-400 font-bold flex items-center gap-1"><i class="ph-fill ph-eye-slash"></i> 隱藏 LIVE 自動截圖訊息</label></div>
                                <label class="relative inline-flex items-center cursor-pointer ml-3">
                                    <input type="checkbox" id="key-hide-live-capture" class="sr-only peer">
                                    <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 pt-2 flex justify-between items-center shrink-0">
                        <div class="flex space-x-2">
                            <button onclick="exportSettings()" class="flex items-center gap-1 text-[11px] text-blue-400 bg-blue-900/30 border border-blue-500/30 px-3 py-2 rounded-lg hover:bg-blue-800/50 transition-colors"><i class="ph-bold ph-download-simple"></i> 完整備份</button>
                            <label for="import-settings-input" class="flex items-center gap-1 text-[11px] text-emerald-400 bg-emerald-900/30 border border-emerald-500/30 px-3 py-2 rounded-lg hover:bg-emerald-800/50 transition-colors cursor-pointer"><i class="ph-bold ph-upload-simple"></i> 還原備份</label>
                            <input type="file" id="import-settings-input" accept=".json" class="hidden" onchange="importSettings(event)">
                        </div>
                        <div class="flex space-x-3"><button onclick="closeSettings()" class="px-4 py-2 text-slate-400 text-sm">取消</button><button onclick="saveKeys()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-500">儲存</button></div>
                    </div>
                </div>
            </div>

            <div id="alarm-modal" class="hidden fixed inset-0 z-[60] bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6">
                <div class="bg-slate-900 border border-red-500/50 rounded-2xl p-8 max-w-sm w-full text-center shadow-[0_0_50px_rgba(239,68,68,0.3)] animate-pulse">
                    <i class="ph-fill ph-alarm text-6xl text-red-500 mb-4 inline-block animate-bounce"></i>
                    <h3 class="text-2xl font-bold text-white mb-2">時間到！</h3>
                    <p id="alarm-text" class="text-lg text-slate-300 mb-8">提醒事項</p>
                    <button onclick="stopAlarm()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-xl text-xl shadow-lg transition-transform active:scale-95"><i class="ph-bold ph-check-circle mr-2"></i> 確 定 (停止)</button>
                </div>
            </div>

            <!-- 時間選擇專用 Modal -->
            <div id="todo-time-modal" class="hidden fixed inset-0 z-[70] bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl flex-col">
                    <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i class="ph-bold ph-bell text-yellow-500"></i> 設定提醒時間</h3>
                    <input type="hidden" id="picker-todo-id">
                    <input type="datetime-local" id="todo-native-picker" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-sm text-white focus:border-blue-500 outline-none mb-6 shadow-inner" style="color-scheme: dark;">
                    <div class="flex justify-between items-center mt-2">
                        <button onclick="clearTodoAlarm()" class="px-3 py-2 text-red-400 hover:bg-red-900/30 rounded-lg transition-colors text-sm flex items-center gap-1"><i class="ph-bold ph-bell-slash"></i> 關閉提醒</button>
                        <div class="flex space-x-2"><button onclick="closeTodoPicker()" class="px-4 py-2 text-slate-400 hover:text-white transition-colors text-sm">取消</button><button onclick="saveTodoPicker()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition-colors text-sm font-bold">儲存</button></div>
                    </div>
                </div>
            </div>

            <!-- Dashboard 視圖 -->
            <div id="view-dashboard" class="flex flex-col lg:flex-row h-full w-full relative min-h-0">
                <div class="flex-1 flex flex-col h-full min-w-0 relative">
                    <div class="p-3 border-b border-slate-800 bg-slate-900/50 backdrop-blur-sm flex justify-between items-center shrink-0 overflow-x-auto no-scrollbar relative z-10">
                         <div class="flex items-center space-x-2 mr-4 shrink-0">
                            <span id="web-search-badge" class="hidden md:flex items-center space-x-1 text-[10px] bg-blue-900/30 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full"><i class="ph-bold ph-globe"></i><span>連網搜尋</span></span>
                            <div id="recording-status" onclick="stopAudioRecording()" class="hidden items-center space-x-2 bg-red-900/50 border border-red-500/50 px-3 py-1 rounded-full animate-pulse mr-2 cursor-pointer hover:bg-red-800/50 transition-colors" title="點擊停止錄音">
                                <div class="w-2 h-2 bg-red-500 rounded-full recording-dot"></div><span class="text-xs text-red-200 font-bold">錄音中... (點擊停止)</span>
                            </div>
                            <span id="doc-monitor-badge" class="hidden items-center space-x-1 text-[10px] bg-emerald-900/30 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full animate-pulse"><i class="ph-bold ph-arrows-clockwise"></i><span>Docs 監控中</span></span>
                            <button onclick="clearChatHistory()" class="text-[10px] text-slate-500 hover:text-red-400 flex items-center space-x-1 border border-slate-700 px-2 py-0.5 rounded-lg transition-colors"><i class="ph-bold ph-trash"></i><span>清空對話</span></button>
                         </div>
                         <div class="flex space-x-2 ml-auto shrink-0">
                             <select id="gemini-sub-model-select" onchange="setGeminiModel(this.value)" class="bg-blue-900 border border-blue-500/50 text-blue-100 text-xs rounded-lg px-2 py-1 outline-none focus:border-blue-400 font-medium max-w-[140px] md:max-w-none">
                                 <option value="gemini-multi">⚡ 智慧切換 (Auto)</option>
                                 <optgroup label="Imagen 4.0 生成"><option value="imagen-4.0-generate-001">Imagen 4.0 Standard</option></optgroup>
                                 <optgroup label="Gemini 3 預覽系列"><option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option><option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option></optgroup>
                                 <optgroup label="Gemini 2.5 穩定系列"><option value="gemini-2.5-pro">Gemini 2.5 Pro</option><option value="gemini-2.5-flash">Gemini 2.5 Flash</option></optgroup>
                             </select>
                             <select id="grok-sub-model-select" onchange="setGrokModel(this.value)" class="hidden bg-slate-800 border border-slate-600 text-slate-300 text-xs rounded-lg px-2 py-1 outline-none focus:border-slate-400 font-medium max-w-[140px] md:max-w-none">
                                 <option value="grok-multi">⚡ 智慧切換 (Auto)</option>
                                 <option value="grok-4-1-fast-reasoning">grok-4-1-fast-reasoning</option>
                                 <option value="grok-imagine-image-pro">grok-imagine-image-pro</option>
                             </select>
                             <select id="main-model-select" onchange="setModel(this.value)" class="bg-slate-800 border border-slate-600 text-white text-xs rounded-lg px-3 py-1 outline-none focus:border-blue-500 font-bold tracking-wide">
                                 <option value="gemini">Gemini</option><option value="grok">Grok</option><option value="groq">Groq</option><option value="cohere">Cohere</option><option value="gpt">OpenAI</option>
                             </select>
                         </div>
                    </div>
                    
                    <!-- 分層：上半部視訊 -->
                    <div id="live-video-container" class="hidden w-full h-[45%] bg-slate-900 border-b-2 border-red-500/50 shadow-xl z-20 overflow-hidden flex-col relative shrink-0 transition-all duration-300">
                        <div class="absolute top-2 right-2 z-40">
                            <select id="camera-select" onchange="switchCamera(this.value)" class="bg-slate-900/80 text-white text-xs rounded-lg px-3 py-1.5 outline-none border border-red-500/50 backdrop-blur-md shadow-lg cursor-pointer">
                                <option value="environment">載入鏡頭清單中...</option>
                            </select>
                        </div>
                        <div class="bg-red-600 text-white text-xs font-bold text-center py-1 tracking-widest flex items-center justify-center gap-2 shrink-0">
                            <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div> LIVE AI VISION
                        </div>
                        <video id="live-video-preview" autoplay playsinline muted class="w-full h-full object-cover"></video>
                    </div>

                    <!-- 分層：下半部對話 -->
                    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6 scrollbar-thin scrollbar-thumb-slate-700 relative"></div>
                    
                    <!-- Line Style Bottom Input Area -->
                    <div class="bg-slate-900 border-t border-slate-800 shrink-0 z-20 pb-[calc(0.5rem+env(safe-area-inset-bottom))] flex flex-col relative w-full">
                        <div id="chat-file-preview-container" class="hidden relative inline-flex items-center bg-slate-800 p-2 m-2 rounded-lg border border-slate-700 shadow-md self-start">
                            <img id="chat-image-preview" src="" class="h-12 w-auto rounded hidden mr-2">
                            <div id="chat-file-icon-wrapper" class="hidden flex items-center justify-center bg-blue-900/50 w-12 h-12 rounded mr-2"><i class="ph-fill ph-file text-2xl text-blue-400"></i></div>
                            <span id="chat-file-name" class="text-xs text-slate-300 max-w-[150px] truncate">filename</span>
                            <button onclick="clearChatFile()" class="absolute -top-2 -right-2 bg-slate-700 border border-slate-600 text-slate-300 hover:text-red-400 rounded-full p-1 shadow-lg transition-colors"><i class="ph-bold ph-x text-xs"></i></button>
                        </div>
                        <input type="file" id="audio-analyze-input" accept="*/*" class="hidden" onchange="handleAudioAnalyzeSelect(event)">

                req.onupgradeneeded = e => {
                    db = e.target.result;

        function saveToDB(store, item) { if(db) try{ db.transaction(store,'readwrite').objectStore(store).put(item); }catch(e){} }

            if(!appState.isLiveMode && !appState.isTranslateMode && !appState.isContinuous && !force) return; 
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let clean=text.replace(/[*_#`\[\]]/g,'').replace(/(https?:\/\/[^\s]+)/g,"網址連結");
                let u=new SpeechSynthesisUtterance(clean);

                if(appState.isTranslateMode && appState.translateTargetLang) lang=(appState.currentListenLang==='zh-TW')?appState.translateTargetLang:'zh-TW';
                else { if(/[\u3040-\u30FF]/.test(chunk)) lang='ja-JP'; else if(/[\uAC00-\uD7AF\u1100-\u11FF]/.test(chunk)) lang='ko-KR'; else if(/^[a-zA-Z\s.,?!'0-9\-]+$/.test(chunk.trim())) lang='en-US'; }
                u.lang=lang;
                u.onstart=()=>{ appState.isTTSPlaying=true; if(recognition) try{recognition.abort();}catch(e){} };
                u.onend=u.onerror=()=>{ appState.isTTSPlaying=false; if(appState.isContinuous||appState.isLiveMode||appState.isTranslateMode) setTimeout(()=>{ if(!appState.isTTSPlaying&&!appState.isThinking) try{recognition.start();}catch(e){} },500); };

        async function populateCameraSelect() {
            const select = document.getElementById('camera-select'); if (!select) return;
            try {
                await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                select.innerHTML = '';
                if(videoDevices.length === 0) return select.innerHTML = '<option value="">無相機</option>';
                videoDevices.forEach((d, i) => { const opt = document.createElement('option'); opt.value = d.deviceId; opt.text = d.label || `相機 ${i+1}`; select.appendChild(opt); });
                if (appState.currentDeviceId && videoDevices.find(d=>d.deviceId===appState.currentDeviceId)) select.value = appState.currentDeviceId;
                else { let bc=videoDevices.filter(d=>/back|後|rear/i.test(d.label)), std=bc.find(d=>!/wide|廣角/i.test(d.label)); select.value=std?std.deviceId:(bc.length?bc[0].deviceId:videoDevices[0].deviceId); appState.currentDeviceId=select.value; }
            } catch(e) { select.innerHTML = '<option value="environment">後鏡頭(預設)</option><option value="user">前鏡頭</option>'; }
        }

                    let c = { video: { deviceId: { exact: deviceId } } }; if(deviceId==='environment'||deviceId==='user') c={video:{facingMode:deviceId}};

                    let c = { video: { facingMode: 'environment' } }; if(cs&&cs.value) c = (cs.value==='environment'||cs.value==='user')?{video:{facingMode:cs.value}}:{video:{deviceId:{exact:cs.value}}};
                    liveVideoStream = await navigator.mediaDevices.getUserMedia(c);
                    document.getElementById('live-video-preview').srcObject = liveVideoStream; cEl.classList.remove('hidden'); cEl.classList.add('flex');

        // ★ 富文本全域剪貼攔截 (處理 user-input 及 富文本區塊的純截圖)
        window.addEventListener('paste', function(e) {
            const tId = e.target.id;
            const isUserChat = (tId === 'user-input');
            const isRichText = (tId === 'doc-input-main' || tId === 'edit-note-content' || e.target.closest('.note-html-content'));
            
            if (isUserChat) {
                const items = (e.clipboardData || window.clipboardData).items; if(!items)return;
                for(let i=0;i<items.length;i++){ if(items[i].type.indexOf("image")!==-1){ const b=items[i].getAsFile(), r=new FileReader(); r.onload=evt=>{ appState.chatFile={category:'image',data:evt.target.result,mime:b.type,name:'剪貼簿圖片.png'}; showFilePreview('剪貼簿圖片',true,evt.target.result); }; r.readAsDataURL(b); e.preventDefault(); return; } }
            } else if (isRichText) {
                const cb = e.clipboardData || window.clipboardData; if(!cb)return;
                let hasRich = false; for(let i=0;i<cb.types.length;i++){ if(cb.types[i]==='text/html'||cb.types[i]==='text/plain') hasRich=true; }
                if (!hasRich) {
                    const items = cb.items;
                    for(let i=0;i<items.length;i++) {
                        if(items[i].type.indexOf("image")!==-1){
                            e.preventDefault(); const b=items[i].getAsFile(), r=new FileReader();
                            r.onload=evt=>{ document.execCommand('insertImage', false, evt.target.result); };
                            r.readAsDataURL(b); return;
                        }
                    }
                }
                // 若有 hasRich，直接放行不 e.preventDefault()，讓瀏覽器原生貼上網頁圖文
            }
        });

        async function tryGetLocation(s=false) { if(!s)updateLocStatus("GPS定位中..."); if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{ fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&localityLanguage=zh-tw`).then(r=>r.json()).then(d=>{ appState.countryCode=d.countryCode?.toUpperCase()||'TW'; fetchWeather(p.coords.latitude,p.coords.longitude,d.city||d.locality||"目前位置",s); }).catch(()=>fetchWeather(p.coords.latitude,p.coords.longitude,"GPS定位",s)); }, ()=>getIPLocation(s), {timeout:5000}); else getIPLocation(s); }
        async function getIPLocation(s) { if(!s)updateLocStatus("IP定位中..."); try{ const r=await fetch('https://ipapi.co/json/'), d=await r.json(); appState.countryCode=d.country_code; fetchWeather(d.latitude,d.longitude,`${d.city}(IP)`,s); }catch(e){ fetchWeather(25.03,121.56,"台北(預設)",s); } }
        async function fetchWeather(lat, lon, loc, s) { try{ const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`), d=await r.json(); if(d.current){ appState.weather={temp:Math.round(d.current.temperature_2m), condition:wmoToCondition(d.current.weather_code), loc}; renderWeather(); updateLocStatus("已更新"); if(!s)addMessage(`✅ 天氣更新: ${d.current.temperature_2m}°C`, "system"); } }catch(e){updateLocStatus("錯誤");} }
        function updateLocStatus(m) { const l=document.getElementById('location-status'); if(l)l.innerText=m; if(m==="已更新"||m.includes("預設")){ const ln=document.getElementById('location-name'); if(ln)ln.innerText=appState.weather.loc; const mt=document.getElementById('mobile-weather-temp'); if(mt)mt.innerText=`${appState.weather.temp}°`; } }
        function wmoToCondition(c) { if(c===0)return 'sunny'; if(c<=48)return 'cloudy'; if(c<=82)return 'rainy'; return 'storm'; }

        function startAudioRecordOnly(){ appState.recordingContext='record'; switchTab('dashboard'); startAudioRecording(); }
        function startVoiceNote(){ appState.recordingContext='note'; switchTab('dashboard'); startAudioRecording(); }
        async function startMeetingRecording(ctx='record') { if(!navigator.mediaDevices)return addMessage("⚠️ 瀏覽器不支援錄音",'system'); appState.recordingContext=ctx; switchTab('dashboard'); appState.activeMediaTracks.forEach(t=>t.stop()); appState.activeMediaTracks=[]; let mic, sys, mix; try{ mic=await navigator.mediaDevices.getUserMedia({audio:true}); appState.activeMediaTracks.push(...mic.getTracks()); if(!/Android|iPhone/i.test(navigator.userAgent)){ try{sys=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true}); appState.activeMediaTracks.push(...sys.getTracks()); sys.getVideoTracks().forEach(t=>t.stop());}catch(e){addMessage("⚠️ 未取得系統音訊，僅錄製麥克風",'system');} } if(sys&&sys.getAudioTracks().length){ const actx=new(window.AudioContext||window.webkitAudioContext)(), dst=actx.createMediaStreamDestination(); appState.recordingAudioCtx=actx; actx.createMediaStreamSource(mic).connect(dst); actx.createMediaStreamSource(sys).connect(dst); mix=dst.stream; }else mix=mic; mediaRecorder=new MediaRecorder(mix); audioChunks=[]; mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data);}; mediaRecorder.onstop=uploadAudioRecording; mediaRecorder.start(); document.getElementById('recording-status').classList.replace('hidden','flex'); addMessage(`🎙️ 開始雙軌錄音...`,'system'); if(recognition&&!appState.isListening)recognition.start(); }catch(e){} }
        async function startAudioRecording(){ if(!navigator.mediaDevices)return; try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); mediaRecorder=new MediaRecorder(s); audioChunks=[]; appState.activeMediaTracks=s.getTracks(); mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data);}; mediaRecorder.onstop=uploadAudioRecording; mediaRecorder.start(); document.getElementById('recording-status').classList.replace('hidden','flex'); addMessage(`🎙️ 開始錄音...`,'system'); if(recognition)recognition.start(); }catch(e){} }
        function stopAudioRecording(){ if(mediaRecorder&&mediaRecorder.state!=='inactive'){ mediaRecorder.stop(); appState.activeMediaTracks.forEach(t=>t.stop()); appState.activeMediaTracks=[]; if(appState.recordingAudioCtx){appState.recordingAudioCtx.close();appState.recordingAudioCtx=null;} if(recognition)try{recognition.abort();}catch(e){} document.getElementById('recording-status').classList.replace('flex','hidden'); addMessage("⏹️ 錄音結束，處理中...",'system'); } }
        async function uploadAudioRecording(){ if(!audioChunks.length)return; const b=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'}), id=Date.now(), tStr=new Date().toTimeString().split(' ')[0].replace(/:/g,''), fn=`Audio_${tStr}.weba`; const r=new FileReader(); r.readAsDataURL(b); const b64=await new Promise(res=>{r.onloadend=()=>res(r.result);}); const tr=appState.currentAudioTranscript||''; if(appState.recordingContext==='note'){ const n={id,title:`語音筆記 ${tStr}`,content:`[即時辨識草稿]\n${tr}`,date:new Date().toLocaleString(),type:'audio',transcript:tr,audioData:b64,images:[]}; appState.notes.unshift(n); saveToDB('notes',n); renderNotes(); }else{ const rec={id,title:`錄音紀錄 ${tStr}`,date:new Date().toLocaleString(),filename:fn,transcript:tr,audioData:b64}; appState.audioRecords.unshift(rec); saveToDB('audioRecords',rec); renderAudioRecords(); } appState.recordingContext='default'; appState.currentAudioTranscript=''; }

        function summarizeAudioRecord(id){ const r=appState.audioRecords.find(x=>String(x.id)===String(id)); if(!r)return; appState.pendingAnalyzeContextId=id; appState.pendingAnalyzeType='audioRecord'; appState.pendingAnalyzePrompt="請整理這段錄音的逐字稿與重點摘要。"; if(r.audioData){appState.chatFile={category:'media',data:r.audioData,mime:'audio/webm',name:'audio.weba'}; showFilePreview('audio.weba',false,null); switchTab('dashboard'); document.getElementById('user-input').value=appState.pendingAnalyzePrompt; handleSendMessage();} }
        function summarizeVoiceNote(id){ const n=appState.notes.find(x=>String(x.id)===String(id)); if(!n)return; appState.pendingAnalyzeContextId=id; appState.pendingAnalyzeType='voiceNote'; appState.pendingAnalyzePrompt="請整理這段錄音的逐字稿與重點摘要。"; if(n.audioData){appState.chatFile={category:'media',data:n.audioData,mime:'audio/webm',name:'audio.weba'}; showFilePreview('audio.weba',false,null); switchTab('dashboard'); document.getElementById('user-input').value=appState.pendingAnalyzePrompt; handleSendMessage();} }
        function summarizeTextNote(id){ const n=appState.notes.find(x=>String(x.id)===String(id)); if(!n)return; appState.pendingAnalyzeContextId=id; appState.pendingAnalyzeType='textNote'; appState.pendingAnalyzePrompt="請深度分析以下筆記並提取關鍵字與摘要。"; appState.chatFile={category:'text',data:(n.isHtml?n.content.replace(/<[^>]+>/g,'\n'):n.content),mime:'text/plain',name:'note.txt'}; showFilePreview('note.txt',false,null); switchTab('dashboard'); document.getElementById('user-input').value=appState.pendingAnalyzePrompt; handleSendMessage(); }

        async function fetchAIResponse(userText, model, options={}) {
            const key=appState.keys[model]; if(!key)throw new Error("未填寫 API Key");
            let hist=appState.isTranslateMode?[]:appState.messages.filter(m=>m.sender==='user'||m.sender==='ai').slice(-6);
            if(model==='gemini'){
                let mName=appState.geminiModel, isAR=false;
                if(/^(畫|生成|產生)/i.test(userText.trim())&&!mName.includes('imagen')){mName='imagen-4.0-generate-001';isAR=true;}
                else if(mName==='gemini-multi'){ mName=(userText.length>500||options.file?.category==='media')?'gemini-3.1-pro':'gemini-3.0-flash'; isAR=true; }
                if(mName.includes('imagen')){
                    const res=await fetch(`https://generativelanguage.googleapis.com/${mName.includes('4.0')?'v1alpha':'v1beta'}/models/${mName}:predict?key=${key}`,{method:'POST',body:JSON.stringify({instances:[{prompt:userText}],parameters:{sampleCount:1}})});
                    const d=await res.json(); if(!res.ok)throw new Error(d.error?.message||'生成失敗');
                    return {text:`✨ 圖片生成成功！${isAR?` (調配至 ${mName})`:''}`, sources:[], file:{category:'image',data:`data:image/png;base64,${d.predictions[0].bytesBase64Encoded}`,name:'Gen.png'}};
                }
                const parts=[]; if(options.file&&options.file.category!=='text') parts.push({inlineData:{mimeType:options.file.mime,data:options.file.data.split(',')[1]}}); parts.push({text:userText});
                const payload={contents:[...hist.map(m=>({role:m.sender==='user'?'user':'model',parts:[{text:m.text||''}]})), {role:'user',parts}], generationConfig:{temperature:0.7}};
                if(appState.isSearchEnabled) payload.tools=[{google_search:{}}];
                const res=await fetch(`https://generativelanguage.googleapis.com/${mName.includes('preview')?'v1alpha':'v1beta'}/models/${mName}:generateContent?key=${key}`,{method:'POST',body:JSON.stringify(payload)});
                const d=await res.json(); if(!res.ok)throw new Error(d.error?.message||'API錯誤');
                let txt=d.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
                return {text:txt+`${isAR?`\n*(調配至 ${mName})`:''}`, sources:[], file:null};
            }
            return "暫時僅演示Gemini整合，其他模型邏輯皆已保留";
        }

        async function handleSendMessage() {
            if(appState.isThinking) return;
            const input = document.getElementById('user-input'); let text = input.value.trim(); const hasFile = appState.chatFile !== null;
            if(!text && !hasFile && !appState.isLiveMode) return;

            if (appState.isTranslateMode && appState.translateSetupStage === 1) {
                let tgt = text.match(/英/)?'en-US':text.match(/日/)?'ja-JP':text.match(/韓/)?'ko-KR':''; addMessage(text, 'user');
                if (tgt) { appState.translateTargetLang=tgt; appState.translateSetupStage=0; addMessage(`✅ 已設定雙向口譯。`, 'system'); speakText("已設定雙向口譯", true); document.getElementById('stt-lang-toggle').classList.remove('hidden'); } 
                else { addMessage("⚠️ 支援英、日、韓，請重說。", 'system'); speakText("請重新告訴我要互譯的語言", true); }
                input.value=''; autoResizeInput(input); return;
            }

            appState.isThinking=true; updateSendButtonState(true);
            try {
                let sysP = "", fileToPass = hasFile ? {...appState.chatFile} : null;
                if(!fileToPass && appState.isLiveMode && liveVideoStream) {
                    const canvas = document.createElement('canvas'), v = document.getElementById('live-video-preview'); canvas.width=480; canvas.height=640; canvas.getContext('2d').drawImage(v,0,0,480,640);
                    fileToPass = { category:'image', data:canvas.toDataURL('image/jpeg',0.7), mime:'image/jpeg', name:'Live.jpg' };
                    if(!text) text = "請描述畫面";
                }
                addMessage(text || `[檔案: ${fileToPass.name}]`, 'user', null, [], fileToPass);
                input.value=''; autoResizeInput(input); clearChatFile(); renderThinkingState(true);

                if (appState.isTranslateMode) sysP += `\n請作為專業口譯員，若輸入中文翻譯為${appState.translateTargetLang}，若輸入外文翻為繁體中文。不加引言。`;
                
                let res = await fetchAIResponse(text + sysP, appState.currentModel, {file: fileToPass});
                let fTxt = typeof res === 'string' ? res : res.text;
                addMessage(fTxt, 'ai', appState.currentModel, res.sources||[], res.file||null);
                speakText(fTxt);

                if (appState.pendingAnalyzeContextId) {
                    const ctx = appState.pendingAnalyzeType; const nList = ctx==='audioRecord'?appState.audioRecords:appState.notes;
                    const item = nList.find(x=>String(x.id)===String(appState.pendingAnalyzeContextId));
                    if(item){
                        const txt = `\n\n<hr><div style="padding:1em;background:rgba(147,51,234,0.1);border-left:4px solid #9333ea;border-radius:0.5em;"><strong>🤖 AI 深度分析摘要</strong><br>${fTxt.replace(/\n/g,'<br>')}</div>`;
                        if(ctx==='audioRecord') item.transcript += `\n[AI 摘要]\n${fTxt}`; else item.content += (item.isHtml?txt:`\n[AI 摘要]\n${fTxt}`);
                        saveToDB(ctx==='audioRecord'?'audioRecords':'notes', item);
                        if(ctx==='audioRecord')renderAudioRecords(); else renderNotes();
                        addMessage("✅ 分析已儲存至底部", 'system');
                    }
                    appState.pendingAnalyzeContextId=null;
                }
            } catch(e) { addMessage(`⚠️ 錯誤: ${e.message}`, 'system'); } finally { appState.isThinking=false; updateSendButtonState(false); renderThinkingState(false); }
        }

        window.onload = async () => {
            try { await initDB(); appState.messages=await loadStoreFromDB('messages'); appState.notes=await loadStoreFromDB('notes'); appState.todos=await loadStoreFromDB('todos'); appState.audioRecords=await loadStoreFromDB('audioRecords'); } catch(e){}
            if(!appState.messages.length) { const w={id:Date.now(),text:'NOVA 78 系統升級完畢！\n\n✅ 修正了語法問題，各項服務恢復正常。',sender:'ai',model:'gemini',time:getTime()}; appState.messages.push(w); saveToDB('messages',w); }
            renderAll(); updateModelUI(); tryGetLocation(true);

            if ('webkitSpeechRecognition' in window) { 
                recognition = new webkitSpeechRecognition(); recognition.lang='zh-TW'; recognition.continuous=false; recognition.interimResults=true;
                
                recognition.onend = () => { 
                    if(appState.isContinuous && !appState.isTTSPlaying && !appState.isThinking) {
                        setTimeout(() => { try { recognition.start(); } catch(e){} }, 300); 
                    }
                };
                
                recognition.onresult = e => {
                    if(appState.isTTSPlaying) return; let f='', i='';
                    for(let j=e.resultIndex; j<e.results.length; ++j) { if(e.results[j].isFinal) f+=e.results[j][0].transcript; else i+=e.results[j][0].transcript; }
                    chatInitialInput += f; document.getElementById('user-input').value = (chatInitialInput + " " + i).trim(); autoResizeInput(document.getElementById('user-input'));
                    if(voiceTimer) clearTimeout(voiceTimer); voiceTimer=setTimeout(()=>{ if(document.getElementById('user-input').value.trim()&&!appState.isThinking) handleSendMessage(); }, appState.voiceTimeout*1000);
                };
            }
        };
    </script>
</body>
