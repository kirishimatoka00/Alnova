<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 網頁基本設定：編碼、響應式視口 (防止手機端縮放) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA 96</title>
    
    <!-- 引入外部庫：Tailwind CSS (樣式框架) 與 Phosphor Icons (圖示庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- 引入 Google 字體 Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS 自訂設定檔 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { slate: { 925: '#0f172a' } },
                    animation: { 'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite', 'spin-slow': 'spin 2s linear infinite' }
                }
            }
        }
    </script>
    
    <!-- 自訂 CSS 樣式 -->
    <style>
        /* 滾動條美化設定 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        /* 隱藏特定元素的滾動條但保持可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 基礎動畫設定 */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        
        /* AI 思考中的「三個點」跳動動畫 (打字提示) */
        .dot-flashing {
            position: relative; width: 6px; height: 6px; border-radius: 5px; background-color: #9880ff; color: #9880ff;
            animation: dot-flashing 1s infinite linear alternate; animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: ""; display: inline-block; position: absolute; top: 0; width: 6px; height: 6px; border-radius: 5px; background-color: #9880ff; color: #9880ff; animation: dot-flashing 1s infinite alternate;
        }
        .dot-flashing::before { left: -10px; animation-delay: 0s; }
        .dot-flashing::after { left: 10px; animation-delay: 1s; }
        @keyframes dot-flashing { 0% { background-color: #9880ff; } 50%, 100% { background-color: rgba(152, 128, 255, 0.2); } }
        
        /* 聊天訊息內部元素的排版微調 */
        .msg-content a { color: #60a5fa; text-decoration: underline; word-break: break-all; cursor: pointer; }
        .msg-content p { margin-bottom: 0.5em; line-height: 1.6; }
        .slide-in { animation: slideIn 0.3s ease-out; }
        
        /* 聊天訊息的懸浮選單顯示邏輯 */
        .msg-group:hover .msg-actions { opacity: 1; }
        .msg-actions { opacity: 0; transition: opacity 0.2s; }
        
        /* 錄音狀態的脈衝動畫 */
        @keyframes recordPulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        .recording-dot { animation: recordPulse 1.5s infinite; }

        /* Toast 提示浮窗樣式 */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #334155; color: #fff; text-align: center;
            border-radius: 8px; padding: 12px; position: fixed; z-index: 100; left: 50%; transform: translateX(-50%);
            bottom: 30px; font-size: 14px; opacity: 0; transition: opacity 0.3s, bottom 0.3s; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 120px; }
        
        /* 預設 Audio 播放器外觀調整 */
        audio { outline: none; border-radius: 8px; }
        audio::-webkit-media-controls-panel { background-color: #1e293b; color: #fff; }
        audio::-webkit-media-controls-current-time-display, audio::-webkit-media-controls-time-remaining-display { color: #fff; }

        /* 富文本編輯器 (Rich Text Editor) 覆寫樣式 */
        .note-html-content, .note-html-content * { color: inherit !important; background-color: transparent !important; font-family: inherit !important; }
        .note-html-content img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 0.5rem 0; background-color: #f8fafc; }
        .note-html-content a { color: #60a5fa !important; text-decoration: underline !important; }
        .note-html-content ul { list-style-type: disc; margin-left: 1.5rem; }
        .note-html-content ol { list-style-type: decimal; margin-left: 1.5rem; }
        .note-html-content iframe { border-radius: 0.5rem; max-width: 100%; }
        [contenteditable]:empty:before { content: attr(placeholder); color: #64748b; pointer-events: none; display: block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden selection:bg-blue-500/30">

    <div class="flex h-[100dvh] w-full relative">
        <!-- ================= 左側邊欄 (桌面版導航) ================= -->
        <aside class="hidden md:flex flex-col w-64 bg-slate-900 border-r border-slate-800 p-6 flex-shrink-0 z-10">
            <!-- 標題與 Logo -->
            <div class="flex items-center space-x-3 mb-10 px-2">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="ph-bold ph-infinity text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">NOVA 96</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider">Ultimate Edition</p>
                </div>
            </div>
            <!-- 主選單連結 -->
            <nav class="flex-1 space-y-2">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item flex items-center space-x-3 w-full p-4 rounded-xl bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-lg transition-all"><i class="ph ph-chats-circle text-xl"></i><span class="font-medium">助理對話</span></button>
                <button onclick="switchTab('schedule')" id="nav-schedule" class="nav-item flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all"><i class="ph ph-calendar-check text-xl"></i><span class="font-medium">行程管理</span></button>
                <button onclick="switchTab('notes')" id="nav-notes" class="nav-item flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all"><i class="ph ph-notebook text-xl"></i><span class="font-medium">筆記/文件</span></button>
                <button onclick="switchTab('audio')" id="nav-audio" class="nav-item flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all"><i class="ph ph-waveform text-xl"></i><span class="font-medium">錄音紀錄</span></button>
            </nav>
            <!-- 底部設定區塊與當前模型狀態 -->
            <div class="mt-auto space-y-3">
                <button onclick="openSettings()" class="flex items-center space-x-2 text-xs text-slate-500 hover:text-slate-300 w-full px-2"><i class="ph ph-gear"></i><span>設定 & 備份</span></button>
                <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50">
                    <div class="flex items-center space-x-2"><i id="status-icon" class="ph-fill ph-globe text-blue-400 text-lg"></i><span id="status-name" class="font-bold text-sm">Gemini</span></div>
                    <p id="model-version-display" class="text-[10px] text-slate-500 mt-1">Ready</p>
                </div>
            </div>
        </aside>

        <!-- ================= 主要內容顯示區 ================= -->
        <main class="flex-1 flex flex-col relative bg-slate-950 overflow-hidden min-h-0">
            <!-- 手機版頂部導航列 -->
            <div class="md:hidden flex items-center justify-between p-3 bg-slate-900 border-b border-slate-800 z-30 shrink-0">
                <div class="flex items-center space-x-2 shrink-0"><i class="ph-bold ph-infinity text-blue-500 text-xl"></i><span class="font-bold text-white">Nova 96</span></div>
                <div class="flex items-center space-x-3 ml-auto pl-2">
                    <div class="flex items-center space-x-1 bg-slate-800/50 px-2 py-1 rounded-lg border border-slate-700/50 cursor-pointer active:scale-95 transition-transform" onclick="cycleManualLocation()">
                        <i id="mobile-weather-icon" class="ph-fill ph-navigation-arrow text-blue-400"></i><span id="mobile-weather-temp" class="text-xs font-bold text-white whitespace-nowrap">更新</span>
                    </div>
                    <button onclick="openSettings()"><i class="ph ph-gear text-slate-400 text-xl"></i></button>
                    <button onclick="toggleMobileMenu()"><i class="ph ph-list text-white text-2xl"></i></button>
                </div>
            </div>

            <!-- 手機版全螢幕彈出選單 -->
            <div id="mobile-menu" class="hidden md:hidden fixed inset-0 z-40 bg-slate-950/95 pt-20 px-6 backdrop-blur-md">
                <nav class="space-y-4">
                    <button onclick="switchTab('dashboard'); toggleMobileMenu()" class="flex items-center space-x-3 w-full p-4 rounded-xl bg-slate-800 text-white"><i class="ph ph-chats-circle text-xl"></i><span>助理對話</span></button>
                    <button onclick="switchTab('schedule'); toggleMobileMenu()" class="flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800"><i class="ph ph-calendar-check text-xl"></i><span>行程管理</span></button>
                    <button onclick="switchTab('notes'); toggleMobileMenu()" class="flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800"><i class="ph ph-notebook text-xl"></i><span>筆記/文件</span></button>
                    <button onclick="switchTab('audio'); toggleMobileMenu()" class="flex items-center space-x-3 w-full p-4 rounded-xl text-slate-400 hover:bg-slate-800"><i class="ph ph-waveform text-xl"></i><span>錄音紀錄</span></button>
                </nav>
            </div>

            <!-- ================= 設定彈窗 (Settings Modal) ================= -->
            <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl flex flex-col max-h-[90vh]">
                    <div class="flex justify-between items-center mb-6 shrink-0"><h3 class="text-xl font-bold text-white">設定</h3><button onclick="closeSettings()"><i class="ph ph-x text-2xl text-slate-400"></i></button></div>
                    <div class="space-y-4 overflow-y-auto flex-1 pr-2 scrollbar-thin">
                        <!-- URL 設定區 (代理及備份) -->
                        <div class="bg-gradient-to-r from-blue-900/30 to-indigo-900/30 p-4 rounded-xl border border-blue-500/50 shadow-inner space-y-4">
                            <div>
                                <label class="block text-xs text-blue-300 mb-2 font-bold flex items-center gap-2"><i class="ph-fill ph-robot"></i> 系統代理 Google Doc (搜尋/爬蟲)</label>
                                <input type="text" id="key-doc-url" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-xs focus:border-blue-500 outline-none mb-2" placeholder="Apps Script URL (for Agent)">
                            </div>
                            <div class="border-t border-white/10 pt-2">
                                 <label class="block text-xs text-red-300 mb-1 font-bold"><i class="ph-fill ph-upload"></i> Google Drive 上傳 URL (錄音/筆記備份用)</label>
                                 <input type="text" id="key-drive-url" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-red-500 outline-none" placeholder="(選填) 雲端備份 Apps Script URL">
                            </div>
                            <div class="flex items-center justify-between mt-2"><span id="doc-monitor-status" class="text-[10px] text-slate-500">未測試</span><button onclick="testDocConnection()" class="text-[10px] bg-blue-600 px-3 py-1 rounded text-white hover:bg-blue-500 transition-colors">測試連線</button></div>
                        </div>
                        <!-- API Key 設定區 -->
                        <div class="space-y-3 pt-2 pb-4 border-b border-slate-800">
                            <div><label class="block text-xs text-blue-400 mb-1">Gemini API Key</label><input type="password" id="key-gemini" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-blue-500 outline-none"></div>
                            <div><label class="block text-xs text-green-400 mb-1">SerpApi Key</label><input type="password" id="key-serpapi" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-green-500 outline-none" placeholder="Your SerpApi Key"></div>
                            <div><label class="block text-xs text-rose-400 mb-1">Groq API Key</label><input type="password" id="key-groq" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-rose-500 outline-none"></div>
                            <div><label class="block text-xs text-violet-400 mb-1">Cohere API Key</label><input type="password" id="key-cohere" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-violet-500 outline-none"></div>
                            <div><label class="block text-xs text-emerald-400 mb-1">OpenAI API Key</label><input type="password" id="key-openai" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-emerald-500 outline-none"></div>
                            <div><label class="block text-xs text-slate-300 mb-1">Grok API Key</label><input type="password" id="key-grok" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-slate-500 outline-none"></div>
                            
                            <!-- 進階選項設定 -->
                            <div class="border-t border-slate-700 pt-3 mt-2 grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs text-amber-400 mb-1 font-bold"><i class="ph-fill ph-timer"></i> 連續語音等待 (秒)</label>
                                    <input type="number" id="key-voice-timeout" min="1" max="60" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-amber-500 outline-none text-slate-300" placeholder="預設: 5">
                                </div>
                                <div>
                                    <label class="block text-xs text-purple-400 mb-1 font-bold"><i class="ph-fill ph-text-align-justify"></i> AI 回覆長度</label>
                                    <select id="key-reply-length" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-purple-500 outline-none text-slate-300">
                                        <option value="medium">中等 (適中)</option>
                                        <option value="short">極簡短 (約50字)</option>
                                        <option value="unlimited">不限長度 (完整)</option>
                                    </select>
                                </div>
                            </div>
                            
                            <!-- 口譯B靜音等待 & 語音速度 -->
                            <div class="border-t border-slate-700 pt-3 mt-2 grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs text-pink-400 mb-1 font-bold"><i class="ph-fill ph-microphone-stage"></i> 口譯B 等待 (秒)</label>
                                    <input type="number" id="key-translate-b-wait" min="0.5" max="10" step="0.5" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-pink-500 outline-none text-slate-300" placeholder="預設: 1.0">
                                </div>
                                <div>
                                    <label class="block text-xs text-cyan-400 mb-1 font-bold"><i class="ph-fill ph-speaker-high"></i> TTS 語音速度</label>
                                    <select id="key-tts-speed" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs focus:border-cyan-500 outline-none text-slate-300">
                                        <option value="1.0">正常 (1.0x)</option>
                                        <option value="1.2">稍快 (1.2x)</option>
                                        <option value="1.5">快 (1.5x)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="flex items-center justify-between border-t border-slate-700 pt-3 mt-2">
                                <div>
                                    <label class="block text-xs text-emerald-400 font-bold flex items-center gap-1"><i class="ph-fill ph-eye-slash"></i> 隱藏 LIVE 自動截圖訊息</label>
                                    <p class="text-[10px] text-slate-500 mt-1">開啟後，聊天室將不顯示自動傳送的相片畫面，讓對話更自然流暢。</p>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer ml-3">
                                    <input type="checkbox" id="key-hide-live-capture" class="sr-only peer">
                                    <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                    <!-- 備份與還原按鈕 -->
                    <div class="mt-4 pt-2 flex justify-between items-center shrink-0">
                        <div class="flex space-x-2">
                            <button onclick="exportSettings()" class="flex items-center gap-1 text-[11px] text-blue-400 bg-blue-900/30 border border-blue-500/30 px-3 py-2 rounded-lg hover:bg-blue-800/50 transition-colors" title="包含所有設定、對話、筆記、錄音"><i class="ph-bold ph-download-simple"></i> 完整備份</button>
                            <label for="import-settings-input" class="flex items-center gap-1 text-[11px] text-emerald-400 bg-emerald-900/30 border border-emerald-500/30 px-3 py-2 rounded-lg hover:bg-emerald-800/50 transition-colors cursor-pointer" title="還原備份資料檔"><i class="ph-bold ph-upload-simple"></i> 還原備份</label>
                            <input type="file" id="import-settings-input" accept=".json" class="hidden" onchange="importSettings(event)">
                        </div>
                        <div class="flex space-x-3"><button onclick="closeSettings()" class="px-4 py-2 text-slate-400 text-sm">取消</button><button onclick="saveKeys()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-500">儲存</button></div>
                    </div>
                </div>
            </div>

            <!-- ================= 即時口譯模式選擇彈窗 ================= -->
            <div id="translate-select-modal" class="hidden fixed inset-0 z-[60] bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl flex flex-col relative overflow-hidden">
                    <div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
                    <div class="flex justify-between items-center mb-6 z-10">
                        <h3 class="text-xl font-bold text-white flex items-center gap-2"><i class="ph-bold ph-translate text-blue-400"></i> 即時口譯模式</h3>
                        <button onclick="closeTranslateSelect()" class="text-slate-400 hover:text-white"><i class="ph-bold ph-x text-xl"></i></button>
                    </div>
                    <div class="space-y-4 z-10">
                        <button onclick="selectTranslateMode('A')" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 p-4 rounded-xl flex items-start gap-3 transition-all text-left group">
                            <i class="ph-fill ph-text-aa text-3xl text-blue-400 group-hover:scale-110 transition-transform"></i>
                            <div>
                                <div class="text-white font-bold mb-1">模式 A：語音轉文字翻譯</div>
                                <div class="text-xs text-slate-400">將語音辨識為文字後發送給 AI 翻譯。適合需要核對文字或較吵雜的環境。</div>
                            </div>
                        </button>
                        <button onclick="selectTranslateMode('B')" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 p-4 rounded-xl flex items-start gap-3 transition-all text-left group">
                            <i class="ph-fill ph-waveform text-3xl text-pink-400 group-hover:scale-110 transition-transform"></i>
                            <div>
                                <div class="text-white font-bold mb-1">模式 B：自動錄音直譯</div>
                                <div class="text-xs text-slate-400">自動偵測說話與靜音。不需按按鈕，講完停頓即自動傳送音檔給 AI 解析，外語辨識最精準。</div>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ================= 資料夾管理彈窗 ================= -->
            <div id="folder-manage-modal" class="hidden fixed inset-0 z-[60] bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl flex flex-col max-h-[80vh]">
                    <div class="flex justify-between items-center mb-6 shrink-0">
                        <h3 class="text-xl font-bold text-white flex items-center gap-2"><i class="ph-bold ph-folder-notch-open text-emerald-400"></i> 管理資料夾</h3>
                        <button onclick="closeFolderManage()" class="text-slate-400 hover:text-white"><i class="ph-bold ph-x text-xl"></i></button>
                    </div>
                    
                    <div class="flex gap-2 mb-4 shrink-0">
                        <input type="text" id="new-folder-input" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-emerald-500 outline-none" placeholder="輸入新資料夾名稱...">
                        <button onclick="addFolder()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold transition-colors whitespace-nowrap"><i class="ph-bold ph-plus"></i> 新增</button>
                    </div>

                    <div class="flex-1 overflow-y-auto pr-2 scrollbar-thin border-t border-slate-800 pt-4 space-y-2" id="folder-manage-list">
                        <!-- JS 動態生成列表 -->
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-slate-800 flex justify-end shrink-0">
                        <button onclick="closeFolderManage()" class="px-6 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition-colors">完成</button>
                    </div>
                </div>
            </div>

            <!-- ================= 鬧鐘提醒彈窗 (Alarm Modal) ================= -->
            <div id="alarm-modal" class="hidden fixed inset-0 z-[60] bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6">
                <div class="bg-slate-900 border border-red-500/50 rounded-2xl p-8 max-w-sm w-full text-center shadow-[0_0_50px_rgba(239,68,68,0.3)] animate-pulse">

    <!-- Toast 系統提示區塊 -->
    <div id="toast">✅ 訊息提示</div>

    <!-- ================= JavaScript 邏輯與功能實作 ================= -->
    <script>
        // --- 全域變數與狀態初始化 ---
        let recognition = null; let noteRecognition = null; let voiceTimer = null; 
        let chatInitialInput = ""; let noteInitialInput = "";
        let alarmInterval = null; let alarmAudioCtx = null; let mediaRecorder = null; let audioChunks = [];
        let liveVideoStream = null; 

        // --- VAD (語音活動偵測) 相關變數 (用於模式 B) ---
        let vadAudioCtx = null, vadAnalyser = null, vadStream = null, vadDataArray = null, vadLoopId = null;
        let vadIsSpeaking = false, vadSilenceStartTime = 0;
        const VAD_SILENCE_THRESHOLD = 15;
        let vadRecorder = null, vadChunks = [];

        // --- IndexedDB 資料庫初始化與操作 ---
        const DB_NAME = 'NovaDB'; const DB_VERSION = 2; let db;

        // 初始化資料庫及 Store
        function initDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) { console.warn("瀏覽器不支援 IndexedDB"); resolve(null); return; }
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('messages')) db.createObjectStore('messages', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('todos')) db.createObjectStore('todos', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('audioRecords')) db.createObjectStore('audioRecords', { keyPath: 'id' });
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }
        function loadStoreFromDB(storeName) { return new Promise((resolve) => { if (!db) return resolve([]); try { const tx = db.transaction(storeName, 'readonly'); const req = tx.objectStore(storeName).getAll(); req.onsuccess = () => resolve(req.result || []); req.onerror = () => resolve([]); } catch(e) { resolve([]); } }); }
        function saveToDB(storeName, item) { if (!db) return; try { db.transaction(storeName, 'readwrite').objectStore(storeName).put(item); } catch(e) {} }
        function deleteFromDB(storeName, id) { 
            if (!db) return; 
            try { 
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                store.delete(id); 
                if (typeof id === 'string' && !isNaN(Number(id))) store.delete(Number(id)); 
            } catch(e) { console.warn("Delete DB Error:", e); } 
        }
        function clearStoreDB(storeName) { if (!db) return; try { db.transaction(storeName, 'readwrite').objectStore(storeName).clear(); } catch(e) {} }

        // --- 核心應用狀態 (appState) 與模型設定 (MODEL_CONFIG) ---
        const appState = {
            currentModel: 'gemini', grokModel: 'grok-multi', geminiModel: 'gemini-multi',
            chatFile: null, currentDeviceId: null,
            docMonitorUrl: localStorage.getItem('nova_doc_url') || '', driveUrl: localStorage.getItem('nova_drive_url') || '',
            messages: [], notes: [], todos: [], audioRecords: [], 
            weather: { temp: '--', condition: 'cloudy', humidity: '--', wind: '--', loc: '未定位' },
            keys: { gemini: localStorage.getItem('nova_key_gemini')||'', groq: localStorage.getItem('nova_key_groq')||'', cohere: localStorage.getItem('nova_key_cohere')||'', openai: localStorage.getItem('nova_key_openai')||'', grok: localStorage.getItem('nova_key_grok')||'', serpapi: localStorage.getItem('nova_key_serpapi')||'' },
            isThinking: false, isListening: false, isNoteListening: false, noteVoiceActive: false, isSearchEnabled: false, isContinuous: false, manualLocIndex: 0,
            isLiveMode: false, 
            translateMode: 'off', // off, A (Text), B (Audio VAD)
            translateBWaitTime: parseFloat(localStorage.getItem('nova_translate_b_wait')) || 1.0,
            ttsSpeed: parseFloat(localStorage.getItem('nova_tts_speed')) || 1.0,
            currentListenLang: 'zh-TW', // Only used internally for UI/fallback
            manualLocs: [{name: "台北", lat: 25.0330, lon: 121.5654}, {name: "台中", lat: 24.1477, lon: 120.6736}, {name: "高雄", lat: 22.6273, lon: 120.3014}],
            pendingReminder: null, reminderStage: 0, countryCode: 'TW', lastLat: null, lastLon: null,
            recordingContext: 'default', currentAudioTranscript: '', editNoteImagesBase64: [], 
            pendingAnalyzePrompt: "", pendingAnalyzeContextId: null, pendingAnalyzeType: "",
            activeMediaTracks: [], recordingAudioCtx: null,
            voiceTimeout: parseInt(localStorage.getItem('nova_voice_timeout')) || 5,
            hideLiveCapture: localStorage.getItem('nova_hide_live_capture') === 'true',
            isTTSPlaying: false,
            playingMsgId: null,
            enableContext: false, // 預設關閉上下文記憶
            replyLength: localStorage.getItem('nova_reply_length') || 'medium',
            
            noteFolders: JSON.parse(localStorage.getItem('nova_folders')) || ['未分類', '工作', '生活'],
            currentNoteFolder: '全部'
        };
        
        const MODEL_CONFIG = {
            gemini: { name: 'Gemini', color: 'text-blue-400', bg: 'bg-blue-600', icon: 'ph-globe' }, grok: { name: 'Grok', color: 'text-slate-100', bg: 'bg-slate-600', icon: 'ph-lightning' }, groq: { name: 'Groq', color: 'text-rose-400', bg: 'bg-rose-600', icon: 'ph-rocket' }, cohere: { name: 'Cohere', color: 'text-violet-400', bg: 'bg-violet-600', icon: 'ph-cpu' }, gpt: { name: 'OpenAI', color: 'text-emerald-400', bg: 'bg-emerald-600', icon: 'ph-cpu' }
        };

        function getTime() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
        
        // --- 訊息文字格式化與安全過濾 ---
        function formatMessage(text) { 
            if (!text) return ''; 
            let images = [];
            let tempText = text.replace(/!\[(.*?)\]\((https?:\/\/[^\s<]+)\)/g, function(match, alt, url) {
                images.push({alt: alt, url: url}); return `___IMG_${images.length - 1}___`;
            });
            let safe = tempText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-bold">$1</strong>'); 
            safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s<]+?)\)|(https?:\/\/[^\s<)\]]+)/g, function(match, mdTitle, mdUrl, rawUrl) {
                let url = mdUrl || rawUrl; url = url.replace(/&amp;/g, "&"); let title = mdTitle || url;
                return `<a href="${url}" target="_blank" class="text-blue-400 underline break-all">${title}</a>`;
            });
            safe = safe.replace(/___IMG_(\d+)___/g, function(match, id) {
                const img = images[id]; const realUrl = img.url.replace(/&amp;/g, "&");
                return `<div class="mt-3 relative group max-w-sm w-full"><img src="${realUrl}" alt="${escapeHtml(img.alt)}" class="rounded-lg border border-slate-700/50 shadow-sm w-full object-contain bg-slate-900"><a href="${realUrl}" target="_blank" download="image.png" class="absolute top-2 right-2 bg-blue-600/90 hover:bg-blue-500 text-white p-2 rounded-lg text-xs opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-md" title="開啟或下載原圖"><i class="ph-bold ph-download-simple"></i> 下載</a></div>`;
            });
            return safe.replace(/\n/g, '<br>'); 
        }

        function escapeHtml(t){return t?t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"):""}

        function showToast(message) {
            const toast = document.getElementById("toast"); toast.innerText = message; toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // --- 語音朗讀 (TTS) 功能 ---
        window.playMessageAudio = function(id) {
            if (appState.isTTSPlaying) {
                window.speechSynthesis.cancel();
                appState.isTTSPlaying = false;
                
                if (String(appState.playingMsgId) === String(id)) {
                    appState.playingMsgId = null;
                    renderMessages();
                    return; // 如果點擊的是同一個訊息，就單純停止
                }
            }
            // 如果點擊不同訊息，或是本來就沒在播放，就開始播放該訊息
            const msg = appState.messages.find(m => String(m.id) === String(id));
            if (!msg || !msg.text) return;
            speakText(msg.text, true, id);
        };

        function speakText(text, force = false, msgId = null) {
            const shouldAutoPlay = appState.isLiveMode || appState.translateMode !== 'off' || appState.isContinuous;
            if (!shouldAutoPlay && !force) return; 

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let cleanText = text.replace(/[*_#`\[\]]/g, '').replace(/(https?:\/\/[^\s]+)/g, "網址連結");
                let utterance = new SpeechSynthesisUtterance(cleanText);
                
                utterance.rate = appState.ttsSpeed; // 套用語音速度設定
                if (msgId) appState.playingMsgId = String(msgId);

                let lang = 'en-US'; 
                let testChunk = cleanText.substring(0, 150);
                
                // 智慧判斷語言，確保發音正確
                if (/[\u3040-\u309F\u30A0-\u30FF]/.test(testChunk)) {
                    lang = 'ja-JP';
                } else if (/[\uAC00-\uD7AF]/.test(testChunk)) {
                    lang = 'ko-KR';
                } else if (/[\u4E00-\u9FA5]/.test(testChunk)) {
                    lang = 'zh-TW';
                } else if (/[a-zA-Z]/.test(testChunk)) {
                    lang = 'en-US';
                }
                
                utterance.lang = lang;
                
                utterance.onstart = () => {
                    appState.isTTSPlaying = true;
                    renderMessages(); // 更新 UI 喇叭圖示
                    if (recognition) { try { recognition.abort(); } catch(e){} }
                };
                
                utterance.onend = () => {
                    appState.isTTSPlaying = false;
                    appState.playingMsgId = null;
                    renderMessages(); // 恢復 UI 喇叭圖示
                    if (appState.isContinuous || appState.isLiveMode || appState.translateMode === 'A') {
                        setTimeout(() => { 
                            if(!appState.isTTSPlaying && !appState.isThinking) {
                                try { recognition.start(); } catch(e){} 
                            }
                        }, 500);
                    }
                };

                utterance.onerror = () => {
                    appState.isTTSPlaying = false;
                    appState.playingMsgId = null;
                    renderMessages();
                    if (appState.isContinuous || appState.isLiveMode || appState.translateMode === 'A') {
                        setTimeout(() => { 
                            if(!appState.isTTSPlaying && !appState.isThinking) {
                                try { recognition.start(); } catch(e){} 
                            }
                        }, 500);
                    }
                };

                window.speechSynthesis.speak(utterance);
            } else if (force) {
                showToast("❌ 您的瀏覽器不支援語音朗讀功能");
            }
        }

        // --- 剪貼簿與檔案下載功能 ---
        window.copyDeepLink = function(text) {
            const textArea = document.createElement("textarea"); textArea.value = text;
            textArea.style.top = "0"; textArea.style.left = "0"; textArea.style.position = "fixed";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand('copy'); showToast("✅ 連結已複製！請貼至手機瀏覽器網址列以跳轉。"); } 
            catch (err) { showToast("❌ 複製失敗"); }
            document.body.removeChild(textArea);
        };
        
        window.copyMessageText = function(id) {
            const msg = appState.messages.find(m => String(m.id) === String(id));
            if (!msg) return;
            const textArea = document.createElement("textarea");
            textArea.value = msg.text;
            textArea.style.top = "0"; textArea.style.left = "0"; textArea.style.position = "fixed";
            document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand('copy'); showToast("✅ 訊息已複製到剪貼簿！"); } 
            catch (err) { showToast("❌ 複製失敗"); }
            document.body.removeChild(textArea);
        };

        function base64ToBlob(base64URI) {
            const splitIndex = base64URI.indexOf(',');
            const mimeStr = base64URI.slice(5, splitIndex).split(';')[0];
            const byteString = atob(base64URI.slice(splitIndex + 1));
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeStr });
        }

        window.downloadLocalAudio = function(id, type) {
            let record = type === 'record' ? appState.audioRecords.find(x => String(x.id) === String(id)) : appState.notes.find(x => String(x.id) === String(id));
            if (!record || !record.audioData) { alert("找不到本地音檔資料"); return; }
            
            const dateObj = new Date(Number(id));
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const year = dateObj.getFullYear();
            const timeStr = dateObj.toTimeString().split(' ')[0].replace(/:/g, '');
            const finalFilename = `NOVA_Audio_${month}${day}${year}_${timeStr}.weba`;

            try {
                const blob = base64ToBlob(record.audioData);
                const blobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = finalFilename;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 2000);
                
                showToast(`✅ 已開始下載：${finalFilename}`);
            } catch(e) {
                alert("下載失敗：" + e.message);
            }
        };

        function renderAll() { renderMessages(); renderTodos(); renderFolderTabs(); renderNotes(); renderAudioRecords(); renderWeather(); }
        
        // --- UI 渲染功能 (訊息) ---
        function renderMessages() { 
            const container = document.getElementById('chat-container'); if(!container) return;
            container.innerHTML = appState.messages.map(msg => { 
                
                let displayMediaHTML = true;
                if (appState.hideLiveCapture && msg.file && msg.file.name === 'Live_Capture.jpg') {
                    if (!msg.text || msg.text === "請詳細描述畫面中的內容。" || msg.text === `[夾帶檔案/畫面: Live_Capture.jpg]`) {
                        return ''; 
                    }
                    displayMediaHTML = false; 
                }

                const isUser = msg.sender === 'user'; const modelInfo = isUser ? null : MODEL_CONFIG[msg.model]; 
                let sourcesHTML = msg.sources?.length ? `<div class="mt-3 pt-3 border-t border-slate-700/50"><p class="text-[10px] text-slate-400 mb-1 font-bold">來源：</p><div class="flex flex-wrap gap-2">${msg.sources.map((s,i)=>`<a href="${s.uri}" target="_blank" class="text-[10px] bg-slate-950/50 text-blue-400 px-2 py-1 rounded border border-slate-700/50 block truncate max-w-[150px]">${i+1}. ${s.title}</a>`).join('')}</div></div>` : ''; 
                
                let mediaHTML = '';
                if (msg.file && displayMediaHTML) {
                    if (msg.file.category === 'image' && msg.file.data) {
                        mediaHTML = `
                        <div class="relative group mb-3 max-w-sm w-full">
                            <img src="${msg.file.data}" class="rounded-lg border border-slate-700/50 shadow-sm w-full object-contain bg-slate-900">
                            <a href="${msg.file.data}" download="${escapeHtml(msg.file.name || 'image.png')}" class="absolute top-2 right-2 bg-blue-600/90 hover:bg-blue-500 text-white p-2 rounded-lg shadow-lg text-xs opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 backdrop-blur-md" title="下載圖片">
                                <i class="ph-bold ph-download-simple"></i> 下載
                            </a>
                        </div>`;
                    } else {
                        let iconType = msg.file.category === 'image' ? 'ph-image' : 'ph-file';
                        if (msg.file.mime && (msg.file.mime.includes('audio') || msg.file.mime.includes('video'))) iconType = 'ph-file-audio';
                        mediaHTML = `<div class="flex items-center gap-2 bg-slate-950/50 p-2 rounded border border-slate-700/50 mb-2 max-w-xs overflow-hidden"><i class="ph-fill ${iconType} text-blue-400 text-xl shrink-0"></i><span class="text-xs text-slate-300 truncate">${escapeHtml(msg.file.name)}</span></div>`;
                    }
                }

                let actionCardHtml = '';
                if (!isUser && msg.actionData && msg.actionData.intentFound && msg.actionData.deepLinkUrl) {
                    const ad = msg.actionData;
                    let iconClass = 'ph-app-window text-blue-400';
                    if(/line/i.test(ad.appName)) iconClass = 'ph-chat-circle-text text-green-500';
                    else if(/youtube/i.test(ad.appName)) iconClass = 'ph-youtube-logo text-red-500';
                    else if(/facebook|fb/i.test(ad.appName)) iconClass = 'ph-facebook-logo text-blue-500';
                    else if(/instagram|ig/i.test(ad.appName)) iconClass = 'ph-instagram-logo text-pink-500';
                    else if(/map|地圖/i.test(ad.appName)) iconClass = 'ph-map-pin text-red-500';
                    else if(/phone|打給|電話|簡訊|sms/i.test(ad.appName)) iconClass = 'ph-phone text-green-400';
                    else if(/thsrc|高鐵|tex|行動購票/i.test(ad.appName)) iconClass = 'ph-train text-orange-500';
                    else if(/shopee|蝦皮/i.test(ad.appName)) iconClass = 'ph-shopping-bag text-orange-600';
                    
                    actionCardHtml = `
                    <div class="mt-3 w-full bg-slate-800/80 border border-slate-700 p-3 rounded-xl shadow-sm flex flex-col gap-3">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-lg bg-slate-900 flex items-center justify-center flex-shrink-0"><i class="ph-fill ${iconClass} text-xl"></i></div>
                            <div class="flex flex-col truncate w-full pr-2">
                                <span class="text-sm font-bold text-white truncate">${escapeHtml(ad.appName || '應用程式')}</span>
                                <span class="text-xs text-slate-400 truncate w-full block">${escapeHtml(ad.actionDescription || '即將執行此操作')}</span>
                            </div>
                        </div>
                        <div class="flex gap-2 w-full">
                            <button onclick="copyDeepLink('${ad.deepLinkUrl}')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1">
                                <i class="ph-bold ph-copy"></i> 複製連結
                            </button>
                            <a href="${ad.deepLinkUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1 text-center">
                                <i class="ph-bold ph-arrow-square-out"></i> 開啟 App
                            </a>
                        </div>
                    </div>`;
                }

                return `<div class="group flex ${isUser ? 'justify-end' : 'justify-start items-start space-x-3'} fade-in relative mb-4">
                    ${!isUser ? `<div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 mt-1 ${modelInfo?.bg||'bg-slate-700'}"><i class="ph-fill ${modelInfo?.icon||'ph-robot'} text-white text-sm"></i></div>` : ''}
                    <div class="msg-group relative max-w-[90%] md:max-w-[80%] rounded-2xl p-4 shadow-sm ${isUser ? 'bg-slate-800 text-white rounded-br-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'}">
                        ${!isUser ? `<span class="text-[10px] font-bold uppercase mb-1 block ${modelInfo?.color||'text-slate-400'} opacity-80">${modelInfo?.name||'System'}</span>` : ''}

        window.renameFolder = function(oldName) {

                const finalName = newName.trim();
                const idx = appState.noteFolders.indexOf(oldName);
                if (idx > -1) {
                    appState.noteFolders[idx] = finalName;
                    localStorage.setItem('nova_folders', JSON.stringify(appState.noteFolders));
                    // 同步更新現有筆記的分類
                    appState.notes.forEach(n => {
                        if (n.folder === oldName) { n.folder = finalName; saveToDB('notes', n); }

                    renderFolderManageList(); renderFolderTabs(); renderNotes();

        // --- 攝影機與 LIVE 視覺功能 ---
        async function populateCameraSelect() {
            const select = document.getElementById('camera-select');
            if (!select) return;
            
            try {
                await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                select.innerHTML = '';
                if (videoDevices.length === 0) {
                    select.innerHTML = '<option value="">無相機</option>';
                    return;
                }

                videoDevices.forEach((d, i) => {
                    const option = document.createElement('option');
                    option.value = d.deviceId;
                    option.text = d.label || `相機 ${i + 1}`;
                    select.appendChild(option);
                });
                
                if (appState.currentDeviceId) {
                    let exists = videoDevices.find(d => d.deviceId === appState.currentDeviceId);
                    if(exists) select.value = appState.currentDeviceId;
                    else select.selectedIndex = 0;
                } else {
                    let backCams = videoDevices.filter(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('後'));
                    let standardCam = backCams.find(d => !d.label.toLowerCase().includes('wide') && !d.label.toLowerCase().includes('廣角'));
                    if(standardCam) select.value = standardCam.deviceId;
                    else if(backCams.length > 0) select.value = backCams[0].deviceId;
                    else select.selectedIndex = 0;
                    
                    appState.currentDeviceId = select.value;
                }
            } catch(e) {

        // --- VAD (語音活動偵測) 引擎核心 ---
        async function startModeBVAD() {
            try {
                vadStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                vadAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = vadAudioCtx.createMediaStreamSource(vadStream);
                vadAnalyser = vadAudioCtx.createAnalyser();
                vadAnalyser.fftSize = 256;
                source.connect(vadAnalyser);
                vadDataArray = new Uint8Array(vadAnalyser.frequencyBinCount);

                startVADRecordingCycle();
                vadLoop();
            } catch (e) {
                addMessage("⚠️ 無法啟動 VAD 麥克風引擎: " + e.message, "system");
                toggleTranslateMode('off');
            }
        }

        function startVADRecordingCycle() {
            if (vadRecorder && vadRecorder.state !== 'inactive') vadRecorder.stop();
            vadChunks = [];
            let mime = 'audio/webm';
            if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
            else if(MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';

            vadRecorder = new MediaRecorder(vadStream, { mimeType: mime });
            vadRecorder.ondataavailable = e => { if (e.data.size > 0) vadChunks.push(e.data); };
            vadRecorder.onstop = processVADAudio;
            vadRecorder.start();
            vadIsSpeaking = false;
            vadSilenceStartTime = 0;
            document.getElementById('recording-status').classList.remove('hidden');
            document.getElementById('recording-status').classList.add('flex');
            document.getElementById('recording-status-text').innerText = "聆聽中 (自動口譯)...";
        }

        function vadLoop() {
            if(appState.translateMode !== 'B') return; // Exit condition
            if(appState.isThinking || appState.isTTSPlaying) {
                 // 暫停偵測：當 AI 在思考或講話時不錄音
                 if (vadRecorder && vadRecorder.state === 'recording') {
                     vadRecorder.stop(); 
                     vadChunks = []; // 直接丟棄
                 }
                 document.getElementById('recording-status-text').innerText = appState.isTTSPlaying ? "朗讀中..." : "翻譯中...";
                 vadLoopId = requestAnimationFrame(vadLoop);
                 return;
            }

            if (vadRecorder && vadRecorder.state !== 'recording') {
                 startVADRecordingCycle();
            }

            vadAnalyser.getByteFrequencyData(vadDataArray);
            let sum = 0;
            for(let i=0; i<vadDataArray.length; i++) sum += vadDataArray[i];
            let avg = sum / vadDataArray.length;

            if (avg > VAD_SILENCE_THRESHOLD) {
                vadIsSpeaking = true;
                vadSilenceStartTime = 0;
                document.getElementById('recording-status-text').innerText = "偵測到語音...";
            } else {
                if (vadIsSpeaking) {
                    if (vadSilenceStartTime === 0) vadSilenceStartTime = Date.now();
                    else if (Date.now() - vadSilenceStartTime > appState.translateBWaitTime * 1000) {
                        // 靜音超時 -> 觸發處理
                        vadIsSpeaking = false;
                        vadRecorder.stop(); // 觸發 processVADAudio
                        document.getElementById('recording-status-text').innerText = "處理中...";
                    }
                } else {
                    document.getElementById('recording-status-text').innerText = "聆聽中 (自動口譯)...";
                }
            }
            vadLoopId = requestAnimationFrame(vadLoop);
        }

        async function processVADAudio() {
            if(vadChunks.length === 0 || appState.translateMode !== 'B') return;
            const blob = new Blob(vadChunks, { type: vadRecorder.mimeType });
            vadChunks = [];

            // 防呆：太短的音訊 (如小於 20kb 通常是雜訊或極短音) 直接拋棄
            if (blob.size < 20000) {
                 if(!appState.isThinking && !appState.isTTSPlaying && appState.translateMode === 'B') startVADRecordingCycle();
                 return;
            }

            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
                 const base64data = reader.result;
                 appState.isThinking = true;
                 renderThinkingState(true);
                 try {
                     let prompt = "你是一位專業的同步口譯員。請直接聽取這段音檔中的對話並進行翻譯。如果說的是中文，請翻譯成自然流暢的英文；如果說的是任何外文，請翻譯成繁體中文。請『只輸出最終的翻譯結果文字』，絕對不要包含任何解釋、原文、拼音或個人評論。";
                     let res = await fetchAIResponse(prompt, 'gemini', {
                         file: { category: 'media', data: base64data, mime: vadRecorder.mimeType, name: 'Voice_Input.weba' }
                     });
                     let finalTxt = typeof res === 'string' ? res : res.text;
                     
                     // 產生使用者標記訊息與 AI 回覆
                     addMessage("[自動語音擷取]", 'user');
                     const newAiMsg = addMessage(finalTxt, 'ai', 'gemini');
                     
                     speakText(finalTxt, true, newAiMsg.id);
                 } catch(e) {
                     console.error("Mode B Translation Error:", e);
                     showToast("翻譯失敗或無有效內容");
                 } finally {
                     appState.isThinking = false;
                     renderThinkingState(false);
                     // 迴圈 vadLoop 會在 isThinking 為 false 時自動重啟錄音
                 }
            }
        }

        function stopModeBVAD() {
            if(vadLoopId) cancelAnimationFrame(vadLoopId);

            const reader = new FileReader();
            addMessage("⏳ 正在讀取備份檔並還原系統，請勿關閉視窗...", "system");
            reader.onload = async function(evt) {

                    if (data.keys) { appState.keys.gemini = data.keys.gemini || ''; appState.keys.groq = data.keys.groq || ''; appState.keys.cohere = data.keys.cohere || ''; appState.keys.openai = data.keys.openai || ''; appState.keys.grok = data.keys.grok || ''; appState.keys.serpapi = data.keys.serpapi || ''; }
                    if (data.urls) { appState.docMonitorUrl = data.urls.docMonitorUrl || ''; appState.driveUrl = data.urls.driveUrl || ''; }
                    if (data.settings) {

        function handleChatFileSelect(e) {
            const file = e.target.files[0]; if (!file) return;
            if (file.size > 20 * 1024 * 1024) { alert("檔案過大，請上傳小於 20MB 的檔案以確保穩定性。"); e.target.value = ''; return; }
            const isText = file.type.startsWith('text/') || !!file.name.match(/\.(txt|csv|md|json|js|html|css|py|cpp|c|java)$/i);
            const isImage = file.type.startsWith('image/');
            const isMedia = file.type.startsWith('audio/') || file.type.startsWith('video/') || file.type === 'application/pdf' || !!file.name.match(/\.(pdf|mp3|wav|mp4|webm|m4a)$/i);
            let category = isImage ? 'image' : (isText ? 'text' : (isMedia ? 'unknown'));
            if (category === 'unknown') category = 'media'; 
            if (isText && file.size > 2 * 1024 * 1024) alert("提醒：純文字檔案較大，可能超出 AI 分析上限，建議擷取重點上傳。");

            let mimeType = file.type || 'application/octet-stream';
            const filenameLower = file.name.toLowerCase();
            if (filenameLower.endsWith('.webm')) mimeType = 'audio/webm';
            else if (filenameLower.endsWith('.mp3')) mimeType = 'audio/mp3';
            else if (filenameLower.endsWith('.wav')) mimeType = 'audio/wav';
            else if (filenameLower.endsWith('.m4a')) mimeType = 'audio/m4a';
            else if (filenameLower.endsWith('.mp4')) mimeType = 'video/mp4';
            else if (filenameLower.endsWith('.pdf')) mimeType = 'application/pdf';

            const reader = new FileReader();
            reader.onload = function(evt) { 
                appState.chatFile = { category: category, data: evt.target.result, mime: mimeType, name: file.name }; 
                showFilePreview(file.name, isImage, evt.target.result); 
                togglePlusMenu(); 
            };
            if (category === 'text') reader.readAsText(file); else reader.readAsDataURL(file);
            e.target.value = ''; 
        }

        // 雲端備份筆記 (利用既有的 Google Drive Upload URL)
        window.backupNoteToDrive = async function(id) {
            if (!appState.driveUrl) {
                alert("請先至設定頁面輸入「Google Drive 上傳 URL (錄音/筆記備份用)」\n\n(若不知如何設定，請參考對話視窗中 AI 提供的 Apps Script 教學！)");
                return;
            }
            const n = appState.notes.find(x => String(x.id) === String(id)); if(!n) return;
            
            const btn = document.getElementById(`btn-backup-${id}`);
            if(btn) { btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> 備份中...'; btn.classList.add('opacity-70', 'cursor-not-allowed'); }
            
            try {
                const pureHtml = n.isHtml ? n.content : n.content.replace(/\n/g, '<br>');
                const htmlDoc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${n.title}</title></head><body style="font-family:sans-serif; padding:20px;"><h1>${n.title}</h1><p style="color:gray;">建立日期: ${n.date}</p><hr><div style="margin-top:20px;">${pureHtml}</div></body></html>`;
                
                // Base64 encode for UTF-8 correctly
                const base64Data = btoa(unescape(encodeURIComponent(htmlDoc)));
                const filename = `${n.title.replace(/[/\\?%*:|"<>]/g, '-')}_${Date.now()}.html`;
                
                const payload = JSON.stringify({ filename: filename, mimeType: 'text/html', data: base64Data });
                
                const res = await fetch(appState.driveUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: payload });
                
                let finalDriveUrl = "";
                if (res.ok) {
                    const resText = await res.text();
                    try { 
                        const resJson = JSON.parse(resText); 
                        finalDriveUrl = resJson.url || resJson.link || resText; 
                    } catch(e) { finalDriveUrl = resText; }
                    
                    n.driveUrl = finalDriveUrl; saveToDB('notes', n); renderNotes();
                    showToast("✅ 筆記雲端備份成功！");
                } else { throw new Error('伺服器回傳狀態異常: HTTP ' + res.status); }
            } catch(e) {
                if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
                    n.driveUrl = "https://drive.google.com/"; saveToDB('notes', n); renderNotes();
                    showToast("✅ 備份請求已送出，由於跨網域限制，無法取得直接連結。請至您的雲端硬碟確認。");
                } else {
                    alert("備份失敗：" + e.message);
                }
            } finally {
                if(btn) { btn.innerHTML = '<i class="ph-bold ph-cloud-arrow-up"></i> 雲端備份'; btn.classList.remove('opacity-70', 'cursor-not-allowed'); }
            }
        };

        // --- 定位與天氣處理 ---
        async function tryGetLocation(silent=false) { 
            if(!silent) updateLocStatus("GPS定位中..."); 
            if (navigator.geolocation) { 
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        appState.lastLat = p.coords.latitude; appState.lastLon = p.coords.longitude;
                        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&localityLanguage=zh-tw`)
                            .then(r=>r.json()).then(d => { 
                                if(d.countryCode) appState.countryCode = d.countryCode.toUpperCase(); 
                                const city = d.city || d.locality || d.principalSubdivision || "目前位置";
                                fetchWeather(p.coords.latitude, p.coords.longitude, city, silent);
                            }).catch(() => { fetchWeather(p.coords.latitude, p.coords.longitude, "GPS定位", silent); });
                    }, (e) => getIPLocation(silent), { timeout: 5000, enableHighAccuracy: true } 
                ); 
            } else getIPLocation(silent); 
        }
        
        async function getIPLocation(silent) { 
            if(!silent) updateLocStatus("IP定位中..."); 
            try { 
                const res = await fetch('https://ipapi.co/json/'); if(!res.ok) throw new Error(); 
                const data=await res.json(); 
                appState.lastLat = data.latitude; appState.lastLon = data.longitude; if (data.country_code) appState.countryCode = data.country_code;
                fetchWeather(data.latitude, data.longitude, `${data.city}(IP)`, silent); 
            } catch(e){ 
                try { 
                    const res2 = await fetch('https://ipwho.is/'); const data2 = await res2.json(); if(!data2.success) throw new Error(); 
                    appState.lastLat = data2.latitude; appState.lastLon = data2.longitude; if (data2.country_code) appState.countryCode = data2.country_code;
                    fetchWeather(data2.latitude, data2.longitude, `${data2.city}(IP)`, silent); 
                } catch(e2) { 
                    updateLocStatus("定位失敗"); if(!silent) addMessage("⚠️ 定位失敗，已切換至預設城市", "system"); 
                    const def = appState.manualLocs[0]; appState.countryCode = 'TW'; fetchWeather(def.lat, def.lon, def.name + " (預設)", true); 
                } 
            } 
        }

        async function startMeetingRecording(context = 'record') {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { 
                addMessage("⚠️ 瀏覽器不支援錄音", 'system'); return; 
            }
            
            appState.recordingContext = context;
            switchTab('dashboard');
            appState.currentAudioTranscript = "";
            
            if (appState.activeMediaTracks) {
                appState.activeMediaTracks.forEach(track => { try{track.stop();}catch(e){} });
            }
            appState.activeMediaTracks = [];

            let micStream = null;
            let sysStream = null;
            let mixedStream = null;

            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            try {
                const micConstraints = { audio: true };

                micStream = await navigator.mediaDevices.getUserMedia(micConstraints);
                appState.activeMediaTracks.push(...micStream.getTracks());

                if (!isMobile && navigator.mediaDevices.getDisplayMedia) {
                    try {
                        addMessage("💡 提示：請在彈出的視窗中選擇【分頁】或【整個螢幕】，並務必勾選左下角的【分享分頁音訊】或【分享系統音訊】，才能成功錄下會議中別人的聲音喔！", 'system');
                        sysStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                        appState.activeMediaTracks.push(...sysStream.getTracks());
                        sysStream.getVideoTracks().forEach(track => { track.stop(); });
                    } catch (sysErr) {
                        addMessage("⚠️ 未取得系統音訊授權或取消操作，將為您降級為僅錄製麥克風聲音。", 'system');
                    }
                } else if (isMobile) {
                    addMessage("⚠️ **系統限制提醒**：手機瀏覽器基於隱私安全，禁止側錄內部系統聲音。\n\n💡 若您要在手機上錄製會議，請**拔下耳機，改用手機擴音播放**，系統會透過麥克風一併收錄會議聲音。", 'system');
                }

                if (sysStream && sysStream.getAudioTracks().length > 0) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContextClass();
                    appState.recordingAudioCtx = audioCtx;
                    
                    const dest = audioCtx.createMediaStreamDestination();
                    
                    if (micStream.getAudioTracks().length > 0) {
                        const micSource = audioCtx.createMediaStreamSource(micStream);
                        micSource.connect(dest);
                    }
                    
                    if (sysStream.getAudioTracks().length > 0) {
                        const sysSource = audioCtx.createMediaStreamSource(sysStream);
                        sysSource.connect(dest);
                    }
                    
                    mixedStream = dest.stream;
                    let titleMsg = appState.recordingContext === 'note' ? "🎙️ 開始【雙軌語音筆記】... (已成功混合麥克風與系統聲音，點擊紅燈結束)" : "🎙️ 開始【雙軌會議錄音】... (已成功混合麥克風與系統聲音，點擊紅燈結束)";
                    addMessage(titleMsg, 'system');
                } else {
                    mixedStream = micStream;
                    let titleMsg = appState.recordingContext === 'note' ? "🎙️ 開始錄製語音筆記... (僅麥克風環境音，點擊紅燈結束)" : "🎙️ 開始錄音... (僅麥克風環境音，點擊紅燈結束)";
                    addMessage(titleMsg, 'system');
                }

                let actualMimeType = 'audio/webm';
                if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) actualMimeType = 'audio/webm;codecs=opus';
                else if (MediaRecorder.isTypeSupported('audio/mp4')) actualMimeType = 'audio/mp4';
                
                mediaRecorder = new MediaRecorder(mixedStream, { mimeType: actualMimeType });
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = uploadAudioRecording; 
                mediaRecorder.start();
                
                document.getElementById('recording-status').classList.remove('hidden'); 
                document.getElementById('recording-status').classList.add('flex');
                document.getElementById('recording-status-text').innerText = "錄音中... (點擊停止)";
                
                if (recognition && !appState.isListening) { 
                    chatInitialInput = document.getElementById('user-input').value; 
                    recognition.start(); 
                }

            } catch (err) {
                addMessage("⚠️ 無法啟動錄音，請檢查麥克風權限或瀏覽器設定。", 'system');
                console.error(err);
            }
        }

        async function startAudioRecording(customContext = null) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { addMessage("⚠️ 瀏覽器不支援錄音", 'system'); return; }
            try {
                if(customContext) appState.recordingContext = customContext;

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream); audioChunks = []; appState.currentAudioTranscript = ""; 
                appState.activeMediaTracks = stream.getTracks();

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = uploadAudioRecording; 
                mediaRecorder.start();
                
                document.getElementById('recording-status').classList.remove('hidden'); document.getElementById('recording-status').classList.add('flex');
                
                let titleMsg = appState.recordingContext === 'note' ? "🎙️ 開始錄製「語音筆記」... (點擊上方紅燈停止)" : "🎙️ 開始錄音... (僅麥克風，點擊上方紅燈停止)";
                addMessage(titleMsg, 'system');
                document.getElementById('recording-status-text').innerText = "錄音中... (點擊停止)";
                if (recognition && !appState.isListening) { chatInitialInput = document.getElementById('user-input').value; recognition.start(); }
            } catch (err) { addMessage("⚠️ 無法啟動錄音，請檢查麥克風權限", 'system'); }
        }

        function stopAudioRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop(); 
                
                if (appState.activeMediaTracks) {
                    appState.activeMediaTracks.forEach(track => { try{track.stop();}catch(e){} });
                    appState.activeMediaTracks = [];
                }
                if (appState.recordingAudioCtx) {
                    try { appState.recordingAudioCtx.close(); } catch(e){}
                    appState.recordingAudioCtx = null;
                }

                if (recognition) { try { recognition.abort(); } catch(e){} }
                document.getElementById('recording-status').classList.add('hidden'); document.getElementById('recording-status').classList.remove('flex');
                
                addMessage("⏹️ 錄音結束，正在處理並儲存至本地端...", 'system');
            } else { 
                document.getElementById('recording-status').classList.add('hidden'); document.getElementById('recording-status').classList.remove('flex'); 
            }
        }
        
        async function uploadAudioRecording() {
            if (audioChunks.length === 0) {
                addMessage(`⚠️ 錄音失敗：未擷取到音訊內容`, 'system');
                appState.recordingContext = 'default'; appState.currentAudioTranscript = "";
                return;
            }

            const actualMimeType = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'audio/webm';
            const audioBlob = new Blob(audioChunks, { type: actualMimeType });
            
            const dateObj = new Date();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const year = dateObj.getFullYear();
            const timeStr = String(dateObj.getHours()).padStart(2, '0') + ":" + String(dateObj.getMinutes()).padStart(2, '0');
            const titleStr = `${year}-${month}-${day} ${timeStr} 錄音`;

            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async function() {
                const base64data = reader.result;
                let recordId = Date.now();
                
                let transcript = appState.currentAudioTranscript.trim() || "未取得語音辨識內容 (可能環境安靜或無講話)";

                if (appState.recordingContext === 'note') {
                    const newNote = { id: recordId, title: "🎙️ " + titleStr, content: transcript, date: dateObj.toLocaleString(), type: 'audio', audioData: base64data, isHtml: false, folder: '未分類' };
                    appState.notes.unshift(newNote); saveToDB('notes', newNote); renderNotes();
                    showToast("✅ 語音筆記已儲存");
                    
                    if (transcript.length > 5) {
                        setTimeout(() => summarizeVoiceNote(recordId), 1000);
                    }
                } else {
                    const newRecord = { id: recordId, title: titleStr, transcript: transcript, date: dateObj.toLocaleString(), audioData: base64data };
                    appState.audioRecords.unshift(newRecord); saveToDB('audioRecords', newRecord); renderAudioRecords();
                    showToast("✅ 錄音紀錄已儲存");
                    
                    if (transcript.length > 5) {
                         setTimeout(() => summarizeAudioRecord(recordId), 1000);
                    }
                }
                
                appState.recordingContext = 'default';
                appState.currentAudioTranscript = "";
            }
        }

        async function captureLiveVideoFrame() {
            if (!appState.isLiveMode || !liveVideoStream) return null;
            const videoEl = document.getElementById('live-video-preview');
            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth || 640;
            canvas.height = videoEl.videoHeight || 480;
            if(canvas.width === 0 || canvas.height === 0) return null; // 攝影機未就緒
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
            
            return new Promise((resolve) => {
                canvas.toBlob(blob => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        resolve({ category: 'image', data: reader.result, mime: 'image/jpeg', name: 'Live_Capture.jpg' });
                    };
                    reader.readAsDataURL(blob);
                }, 'image/jpeg', 0.8);
            });
        }

        async function handleSendMessage() {
            if (appState.isThinking) return;
            const inputEl = document.getElementById('user-input'); 
            let text = inputEl.value.trim(); 
            let fileData = appState.chatFile;
            
            // 如果是在 LIVE 模式下，且沒有夾帶檔案，則自動截取當前畫面
            if (appState.isLiveMode && !fileData) {
                fileData = await captureLiveVideoFrame();
